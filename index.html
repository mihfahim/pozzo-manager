<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6FA8">
<title>Pozzo Manager v9</title>
<meta name="description" content="Pozzo Toys Stock, Sale, Dashboard, Orders, and Dispatch manager.">
<meta property="og:title" content="Pozzo Manager v9">
<meta property="og:description" content="Pozzo Toys Stock, Sale, Dashboard, Orders, and Dispatch manager.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="icon" href="icon-192.png?v=17">
<link rel="apple-touch-icon" href="icon-192.png?v=17">
<style>
:root{--bg:#f4f7fa;--card:#ffffff;--hdr:#ffffff;--line:#dce4ec;--ink:#1c1b1f;--mut:#5f6368;--blue:#1f6fa8;--deep:#0f3f66;--soft:#f5fafe;--chip:#deeffb;--on-acc:#ffffff}
html.dark{--bg:#0f141b;--card:#18212c;--hdr:#141c26;--line:#2b3848;--ink:#edf2f7;--mut:#9aa9ba;--blue:#4da3e3;--deep:#b8dcf8;--soft:#1e2936;--chip:#17344d;--on-acc:#0b1926}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior-y:contain;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh}
header{position:relative;flex:none;background:var(--hdr);text-align:center;padding:2px 10px 4px;border-bottom:3px solid var(--blue);box-shadow:0 1px 3px rgba(15,63,102,.06)}
header img{display:block;margin:0 auto;width:160px;max-width:55%;height:72px;object-fit:contain;background:transparent}
.app-ver{position:absolute;left:10px;top:12px;min-height:32px;padding:6px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:center;line-height:1}
.theme-btn{position:absolute;right:10px;top:10px;min-height:36px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.1}
.theme-dots{display:inline-flex;align-items:center;gap:2px}
.theme-dots i{display:inline-block;width:9px;height:9px;border-radius:999px;border:1px solid rgba(128,128,128,.35);font-style:normal}
.theme-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav{display:flex;gap:3px;max-width:640px;margin:2px auto 0;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 0;min-height:38px;border:0;border-radius:999px;padding:8px 6px;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s ease,color .15s ease}
nav button.on{background:var(--blue);color:var(--on-acc)}
nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;overscroll-behavior-y:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pager::-webkit-scrollbar{display:none}
#pager section{flex:0 0 100%;width:100%;min-width:100%;height:100%;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.th-modal{position:fixed;inset:0;background:rgba(12,18,28,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:0}
.th-sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.28)}
.th-handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 12px}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.th-head h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--ink)}
.th-close{min-width:44px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:20px;font-weight:600;cursor:pointer}
.th-prev{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.th-prev-badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--deep);font-size:12px;font-weight:700}
.th-prev-btn{padding:8px 14px;border-radius:12px;background:var(--blue);color:var(--on-acc);font-size:13px;font-weight:700}
.th-sec{margin-bottom:14px}
.th-lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
.th-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th-preset{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.th-preset.on{border-color:var(--blue);background:var(--chip);color:var(--deep)}
.th-swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.th-sub{font-size:11.5px;font-weight:600;color:var(--mut);margin:8px 0 6px}
.th-sw{width:44px;height:44px;border-radius:14px;border:2px solid rgba(128,128,128,.28);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.th-sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.th-sw.on::after{content:"✓";font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.th-sw.light-sw.on::after{color:#0f172a;text-shadow:none}
.th-pick{width:44px;height:44px;border-radius:14px;border:1.5px dashed var(--line);background:var(--soft);padding:3px;cursor:pointer}
.th-foot{display:flex;gap:10px;margin-top:16px}
.th-foot button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.th-foot button.p{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
[hidden]{display:none!important}
@media (min-width:640px){
  .th-modal{align-items:center;padding:16px}
  .th-sheet{border-radius:26px;padding:16px 20px 22px}
  .th-handle{display:none}
}
@media (max-width:390px){
  nav button{padding:10px 4px;font-size:12.5px}
  .app-ver{padding:5px 8px;font-size:11.5px}
  .theme-btn{padding:5px 9px;font-size:12px}
}
</style>
</head>
<body>
<script>try{var _p=JSON.parse(localStorage.getItem("pt_palette")||"null");if(_p&&/^(slate|obsidian|carbon|navy|forest|espresso|plum|steel)$/.test(_p.b||""))document.documentElement.classList.add("dark");else if(!_p&&localStorage.getItem("pt_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<header>
  <span class="app-ver" aria-label="App version v9">v9</span>
  <button id="themeBtn" class="theme-btn" type="button" onclick="openThemeModal()" aria-label="Customize theme palette"><span class="theme-dots"><i id="thDot1"></i><i id="thDot2"></i><i id="thDot3"></i></span><span>Theme</span></button>
  <img alt="Pozzo Toys" src="icon-192.png?v=17">
  <nav aria-label="Primary pages">
    <button id="t0" type="button">Stock</button>
    <button id="t1" type="button">Sale</button>
    <button id="t2" class="on" type="button">Dashboard</button>
    <button id="t3" type="button">Orders</button>
    <button id="t4" type="button">Dispatch</button>
  </nav>
</header>
<div id="pager">
  <section><iframe id="f0" title="Stock"></iframe></section>
  <section><iframe id="f1" title="Sale"></iframe></section>
  <section><iframe id="f2" title="Dashboard"></iframe></section>
  <section><iframe id="f3" title="Orders"></iframe></section>
  <section><iframe id="f4" title="Dispatch"></iframe></section>
</div>
<div id="themeModal" class="th-modal" hidden onclick="if(event.target===this)closeThemeModal()"></div>
<script>
const APP_VER="v9";
const pager=document.getElementById("pager");
const tabs=[0,1,2,3,4].map(i=>document.getElementById("t"+i));
const HASH=["#stock","#sale","#dashboard","#orders","#dispatch"];
const INIT_HASH={"#stock":0,"#sale":1,"#sales":1,"#dashboard":2,"#orders":3,"#dispatch":4,"#sticker":4,"#stickers":4};
const SRC=["stock.html","orders.html","dashboard.html","all-orders.html","dispatch.html"];
const TAB_MAP={stock:0,sale:1,sales:1,dashboard:2,orders:3,dispatch:4,sticker:4,stickers:4};

const h0=String(location.hash||"").toLowerCase();
let cur=INIT_HASH[h0]!==undefined?INIT_HASH[h0]:2;
let ready=false,stockDirty=false,stockPendingTab="",dashDirty=false,ordersDirty=false,dispDirty=false;

function load(i){
  const f=document.getElementById("f"+i);
  if(!f.getAttribute("src")){f.src=SRC[i];return false}
  return true;
}
function postTo(i,msg){
  const f=document.getElementById("f"+i);
  try{if(f&&f.contentWindow)f.contentWindow.postMessage(msg,"*")}catch(e){}
}
function flushTabRefresh(i,wasLoaded){
  if(!wasLoaded)return;
  if(i===0&&(stockDirty||stockPendingTab)){
    const t=stockPendingTab;stockDirty=false;stockPendingTab="";
    postTo(0,{type:"pozzo:refresh-stock",tab:t});
  }
  if(i===2&&dashDirty){dashDirty=false;postTo(2,{type:"pozzo:refresh-dashboard"})}
  if(i===3&&ordersDirty){ordersDirty=false;postTo(3,{type:"pozzo:refresh-orders"})}
  if(i===4&&dispDirty){dispDirty=false;postTo(4,{type:"pozzo:refresh-dispatch"})}
}

tabs.forEach((t,k)=>t.classList.toggle("on",k===cur));
load(cur);

function snapInitial(){
  const w=pager.clientWidth;
  if(!w)return false;
  const target=cur*w;
  if(Math.abs(pager.scrollLeft-target)>2)pager.scrollLeft=target;
  ready=true;
  return true;
}
snapInitial();
if(!ready){
  requestAnimationFrame(snapInitial);
  try{
    const ro=new ResizeObserver(()=>{if(snapInitial())ro.disconnect()});
    ro.observe(pager);
  }catch(e){}
}

function go(i){
  ready=true;
  cur=i;
  const wasLoaded=load(i);
  tabs.forEach((t,k)=>t.classList.toggle("on",k===i));
  pager.scrollTo({left:i*pager.clientWidth,behavior:"smooth"});
  try{history.replaceState(null,"",HASH[i])}catch(e){}
  flushTabRefresh(i,wasLoaded);
}
tabs.forEach((t,i)=>t.addEventListener("click",()=>go(i)));

pager.addEventListener("scroll",()=>{
  if(!ready&&!snapInitial())return;
  const w=pager.clientWidth;
  if(!w)return;
  const i=Math.round(pager.scrollLeft/w);
  if(i!==cur&&i>=0&&i<=4){
    cur=i;
    const wasLoaded=load(i);
    tabs.forEach((t,k)=>t.classList.toggle("on",k===i));
    try{history.replaceState(null,"",HASH[i])}catch(e){}
    flushTabRefresh(i,wasLoaded);
  }
},{passive:true});

window.addEventListener("resize",()=>{
  if(pager.clientWidth)pager.scrollLeft=cur*pager.clientWidth;
});

function handleHashOrPop(){
  const h=String(location.hash||"").toLowerCase();
  const idx=INIT_HASH[h];
  if(idx!==undefined&&idx!==cur)go(idx);
}
window.addEventListener("hashchange",handleHashOrPop);
window.addEventListener("popstate",handleHashOrPop);

window.addEventListener("message",e=>{
  const d=e&&e.data;
  if(!d||typeof d!=="object")return;
  if(d.type==="pozzo:stock-dirty"){
    dashDirty=true;dispDirty=true;
    const f0=document.getElementById("f0");
    if(e.source!==(f0&&f0.contentWindow)){
      stockDirty=true;
      if(d.tab)stockPendingTab=d.tab;
      if(cur===0){const t=stockPendingTab;stockDirty=false;stockPendingTab="";postTo(0,{type:"pozzo:refresh-stock",tab:t})}
    }
    const f4=document.getElementById("f4");
    if(e.source!==(f4&&f4.contentWindow)&&f4&&f4.getAttribute("src")){dispDirty=false;postTo(4,{type:"pozzo:refresh-dispatch"})}
  }else if(d.type==="pozzo:open-stock-issues"){
    const f=document.getElementById("f0");
    if(!f.getAttribute("src")){
      f.src="stock.html#issues";
      stockDirty=false;stockPendingTab="";
      go(0);
    }else{
      stockDirty=false;stockPendingTab="";
      go(0);
      postTo(0,{type:"pozzo:refresh-stock",tab:"issues"});
    }
  }else if(d.type==="pozzo:order-dirty"){
    dashDirty=true;ordersDirty=true;dispDirty=true;
    const f1=document.getElementById("f1");
    if(e.source!==(f1&&f1.contentWindow))postTo(1,d);
    if(cur===2){dashDirty=false;postTo(2,{type:"pozzo:refresh-dashboard"})}
    const f3=document.getElementById("f3");
    if(e.source!==(f3&&f3.contentWindow)&&f3&&f3.getAttribute("src")){ordersDirty=false;postTo(3,{type:"pozzo:refresh-orders"})}
    else if(cur===3){ordersDirty=false;postTo(3,{type:"pozzo:refresh-orders"})}
    const f4=document.getElementById("f4");
    if(e.source!==(f4&&f4.contentWindow)&&f4&&f4.getAttribute("src")){dispDirty=false;postTo(4,{type:"pozzo:refresh-dispatch"})}
    else if(cur===4){dispDirty=false;postTo(4,{type:"pozzo:refresh-dispatch"})}
  }else if(d.type==="pozzo:switch-tab"||d.type==="switchTab"){
    const idx=typeof d.tab==="number"?d.tab:TAB_MAP[String(d.tab||"").toLowerCase()];
    if(idx!==undefined){
      if(idx===0&&(d.subtab||d.filter)){
        const f=document.getElementById("f0");
        const hashPart=d.filter?"#"+d.filter:(d.subtab?"#"+d.subtab:"");
        if(!f.getAttribute("src")){f.src="stock.html"+hashPart;go(0);return}
        go(0);
        postTo(0,{type:"pozzo:refresh-stock",tab:d.subtab||"stock",filter:d.filter||""});
        return;
      }
      if(idx===1&&d.orderId){
        const f=document.getElementById("f1");
        if(!f.getAttribute("src")){f.src="orders.html#order="+encodeURIComponent(d.orderId);go(1);return}
        go(1);
        postTo(1,{type:"pozzo:open-order",orderId:d.orderId});
        return;
      }
      go(idx);
    }
  }
});

const PT_BASES={
  paper:{id:"paper",name:"Crisp Paper",bg:"#f4f7fa",card:"#ffffff",hdr:"#ffffff",inp:"#ffffff",line:"#dce4ec",ink:"#1c1b1f",mut:"#5f6368",dark:false},
  snow:{id:"snow",name:"Pure Snow",bg:"#f8f9fb",card:"#ffffff",hdr:"#ffffff",inp:"#ffffff",line:"#e2e6ec",ink:"#161922",mut:"#5b6270",dark:false},
  linen:{id:"linen",name:"Warm Linen",bg:"#f4efe6",card:"#fffdf8",hdr:"#fffdf8",inp:"#fffdf8",line:"#e2d9c8",ink:"#211e19",mut:"#6d6558",dark:false},
  sand:{id:"sand",name:"Warm Sand",bg:"#efe6d5",card:"#fdfaf3",hdr:"#fdfaf3",inp:"#fdfaf3",line:"#ddd0b8",ink:"#241d14",mut:"#6d604e",dark:false},
  mist:{id:"mist",name:"Cool Mint",bg:"#edf5f2",card:"#ffffff",hdr:"#ffffff",inp:"#ffffff",line:"#cfe0d9",ink:"#18221e",mut:"#566860",dark:false},
  sky:{id:"sky",name:"Powder Sky",bg:"#e8f1fb",card:"#fbfdff",hdr:"#fbfdff",inp:"#fbfdff",line:"#ccddf0",ink:"#152030",mut:"#51647a",dark:false},
  rose:{id:"rose",name:"Soft Blush",bg:"#f8eff3",card:"#fffdfe",hdr:"#fffdfe",inp:"#fffdfe",line:"#e8d5de",ink:"#24191e",mut:"#6f5963",dark:false},
  lavender:{id:"lavender",name:"Pale Lilac",bg:"#f1eef9",card:"#fdfcff",hdr:"#fdfcff",inp:"#fdfcff",line:"#dcd5ee",ink:"#1d182b",mut:"#625878",dark:false},
  slate:{id:"slate",name:"Midnight Slate",bg:"#0f141b",card:"#18212c",hdr:"#141c26",inp:"#121923",line:"#2b3848",ink:"#edf2f7",mut:"#9aa9ba",dark:true},
  obsidian:{id:"obsidian",name:"Deep Night",bg:"#131114",card:"#1d1920",hdr:"#18141a",inp:"#151217",line:"#322b38",ink:"#f2eef6",mut:"#a59ab0",dark:true},
  carbon:{id:"carbon",name:"Pure Carbon",bg:"#0c0d0f",card:"#15171b",hdr:"#111216",inp:"#101215",line:"#272b33",ink:"#f1f3f5",mut:"#9ca3af",dark:true},
  navy:{id:"navy",name:"Deep Marine",bg:"#0c1628",card:"#14223b",hdr:"#101c32",inp:"#0f1b30",line:"#25395c",ink:"#ebf2ff",mut:"#97acc9",dark:true},
  forest:{id:"forest",name:"Pine Night",bg:"#0d1915",card:"#142620",hdr:"#10201b",inp:"#0f1e19",line:"#264037",ink:"#ebf5f0",mut:"#93ada2",dark:true},
  espresso:{id:"espresso",name:"Warm Cocoa",bg:"#1a1310",card:"#261c17",hdr:"#201713",inp:"#1d1511",line:"#3d2f27",ink:"#f6eee8",mut:"#b4a094",dark:true},
  plum:{id:"plum",name:"Velvet Plum",bg:"#191124",card:"#241934",hdr:"#1e142c",inp:"#1b1328",line:"#3a2b52",ink:"#f4eefc",mut:"#aa9ac2",dark:true},
  steel:{id:"steel",name:"Cool Storm",bg:"#161b22",card:"#21262d",hdr:"#1b2027",inp:"#181d23",line:"#343b45",ink:"#f0f6fc",mut:"#9da7b3",dark:true}
};
const PT_ACCENTS=["#1f6fa8","#2563eb","#0284c7","#0ea5a4","#0f766e","#15803d","#2b5f56","#65a30d","#b45309","#d97706","#c2410c","#dc2626","#be123c","#db2777","#7e22ce","#4338ca"];
const PT_TINTS=["#1f6fa8","#3b82f6","#06b6d4","#0ea5a4","#10b981","#16a34a","#84cc16","#eab308","#f59e0b","#f97316","#c25934","#ef4444","#e11d48","#ec4899","#8b5cf6","#6366f1"];
const PT_PRESETS=[
  {id:"classic",name:"Pozzo Blue",b:"paper",p:"#1f6fa8",s:"#1f6fa8"},
  {id:"sage",name:"Sage & Clay",b:"linen",p:"#2b5f56",s:"#c25934"},
  {id:"lilac",name:"Soft Lilac",b:"lavender",p:"#4338ca",s:"#ec4899"},
  {id:"aqua",name:"Midnight Aqua",b:"slate",p:"#4da3e3",s:"#0ea5a4"},
  {id:"amber",name:"Night Amber",b:"obsidian",p:"#e09f3e",s:"#7c3aed"},
  {id:"pine",name:"Pine & Gold",b:"forest",p:"#15803d",s:"#f59e0b"}
];
const clampC=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function parseHex(h){const m=String(h||"").trim().match(/^#?([0-9a-f]{6})$/i);if(!m)return[31,111,168];const n=parseInt(m[1],16);return[(n>>16)&255,(n>>8)&255,n&255]}
function toHex(rgb){return"#"+rgb.map(x=>clampC(Math.round(x),0,255).toString(16).padStart(2,"0")).join("")}
function mixHex(a,b,t){const c1=parseHex(a),c2=parseHex(b);return toHex([c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t])}
function lumHex(h){const c=parseHex(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function normPal(raw){
  const d={b:"paper",p:"#1f6fa8",s:"#1f6fa8"};
  if(!raw||typeof raw!=="object")return d;
  return{
    b:PT_BASES[raw.b]?raw.b:d.b,
    p:/^#[0-9a-f]{6}$/i.test(raw.p||"")?raw.p.toLowerCase():d.p,
    s:/^#[0-9a-f]{6}$/i.test(raw.s||"")?raw.s.toLowerCase():(/^#[0-9a-f]{6}$/i.test(raw.p||"")?raw.p.toLowerCase():d.s)
  };
}
function readSavedPalette(){
  try{
    const raw=localStorage.getItem("pt_palette");
    if(raw)return normPal(JSON.parse(raw));
    if(localStorage.getItem("pt_theme")==="dark")return{b:"slate",p:"#4da3e3",s:"#1f6fa8"};
  }catch(e){}
  return normPal(null);
}
function computeThemeVars(pal){
  const base=PT_BASES[pal.b]||PT_BASES.paper;
  const dark=!!base.dark;
  const rawP=pal.p,rawS=pal.s;
  const acc=dark?(lumHex(rawP)<0.24?mixHex(rawP,"#ffffff",0.36):rawP):(lumHex(rawP)>0.38?mixHex(rawP,"#0e1726",0.30):rawP);
  const deep=dark?(lumHex(rawS)<0.45?mixHex(rawS,"#ffffff",0.60):mixHex(rawS,"#ffffff",0.25)):(lumHex(rawS)>0.22?mixHex(rawS,"#09131d",0.48):mixHex(rawS,"#09131d",0.22));
  const sub=dark?mixHex(base.card,rawS,0.12):mixHex(base.card,rawS,0.065);
  const bd=dark?mixHex(base.bg,rawS,0.26):mixHex(base.card,rawS,0.14);
  const onAcc=lumHex(acc)>(dark?0.42:0.44)?"#0b1926":"#ffffff";
  return{
    dark,base,acc,deep,sub,bd,onAcc,
    vars:{
      "--bg":base.bg,"--card":base.card,"--hdr":base.hdr,"--soft":sub,"--sub":sub,"--in":base.inp,
      "--line":base.line,"--ink":base.ink,"--mut":base.mut,"--blue":acc,"--grn":acc,"--blu":acc,
      "--deep":deep,"--chip":bd,"--bd":bd,"--on-acc":onAcc
    },
    metaColor:dark?base.hdr:(base.b==="paper"&&rawP==="#1f6fa8"?"#1F6FA8":acc)
  };
}
let curPalette=readSavedPalette();
function applyPaletteTheme(pal,save){
  try{
    curPalette=normPal(pal);
    const t=computeThemeVars(curPalette);
    const root=document&&document.documentElement;
    if(root&&root.classList)root.classList.toggle("dark",t.dark);
    if(root&&root.style&&typeof root.style.setProperty==="function"){
      Object.keys(t.vars).forEach(k=>root.style.setProperty(k,t.vars[k]));
    }
    const d1=document.getElementById("thDot1"),d2=document.getElementById("thDot2"),d3=document.getElementById("thDot3");
    if(d1)d1.style.background=t.base.bg;
    if(d2)d2.style.background=t.acc;
    if(d3)d3.style.background=curPalette.s;
    const mt=document.querySelector&&document.querySelector('meta[name="theme-color"]');
    if(mt)mt.setAttribute("content",t.metaColor);
    if(save){
      try{localStorage.setItem("pt_palette",JSON.stringify(curPalette))}catch(e){}
      try{localStorage.setItem("pt_theme",t.dark?"dark":"light")}catch(e){}
    }
    for(let k=0;k<5;k++)postTo(k,{type:"pozzo:theme",palette:curPalette,dark:t.dark});
  }catch(e){}
}
function setPalettePreset(id){
  const pr=PT_PRESETS.find(x=>x.id===id);
  if(!pr)return;
  applyPaletteTheme({b:pr.b,p:pr.p,s:pr.s},true);
  renderThemeModal();
}
function setPaletteTone(slot,val){
  const next=Object.assign({},curPalette);
  next[slot]=val;
  applyPaletteTheme(next,true);
  renderThemeModal();
}
function resetPaletteTheme(){
  applyPaletteTheme({b:"paper",p:"#1f6fa8",s:"#1f6fa8"},true);
  renderThemeModal();
}
function renderThemeModal(){
  const m=document.getElementById("themeModal");
  if(!m||m.hidden)return;
  const bases=Object.values(PT_BASES);
  const pal=curPalette;
  m.innerHTML=`<div class="th-sheet" role="dialog" aria-modal="true" aria-labelledby="thTitle">
    <div class="th-handle" aria-hidden="true"></div>
    <div class="th-head"><h2 id="thTitle">Customize theme</h2><button class="th-close" type="button" onclick="closeThemeModal()" aria-label="Close theme customizer">&times;</button></div>
    <div class="th-prev">
      <div><div style="font-weight:700;font-size:14.5px">Live preview</div><span class="th-prev-badge">19-Nov-2026</span></div>
      <span class="th-prev-btn">Save order</span>
    </div>
    <div class="th-sec"><div class="th-lbl"><span>Starter combinations</span></div>
      <div class="th-presets">${PT_PRESETS.map(pr=>{
        const on=pal.b===pr.b&&pal.p===pr.p&&pal.s===pr.s;
        return`<button type="button" class="th-preset${on?" on":""}" onclick="setPalettePreset('${pr.id}')"><span class="theme-dots"><i style="background:${PT_BASES[pr.b].bg}"></i><i style="background:${pr.p}"></i><i style="background:${pr.s}"></i></span><span>${pr.name}</span></button>`;
      }).join("")}</div>
    </div>
    <div class="th-sec"><div class="th-lbl"><span>1. Surface tone</span><span>${PT_BASES[pal.b].name}</span></div>
      <div class="th-sub">Light surfaces</div>
      <div class="th-swatches">${bases.filter(b=>!b.dark).map(b=>`<button type="button" class="th-sw light-sw${pal.b===b.id?" on":""}" style="background:${b.bg}" title="${b.name}" aria-label="${b.name}" onclick="setPaletteTone('b','${b.id}')"></button>`).join("")}</div>
      <div class="th-sub">Dark surfaces</div>
      <div class="th-swatches">${bases.filter(b=>b.dark).map(b=>`<button type="button" class="th-sw${pal.b===b.id?" on":""}" style="background:${b.bg}" title="${b.name}" aria-label="${b.name}" onclick="setPaletteTone('b','${b.id}')"></button>`).join("")}</div>
    </div>
    <div class="th-sec"><div class="th-lbl"><span>2. Primary accent</span><span>${pal.p.toUpperCase()}</span></div>
      <div class="th-swatches">${PT_ACCENTS.map(c=>`<button type="button" class="th-sw${lumHex(c)>0.45?" light-sw":""}${pal.p===c?" on":""}" style="background:${c}" aria-label="Primary ${c}" onclick="setPaletteTone('p','${c}')"></button>`).join("")}<input class="th-pick" type="color" value="${pal.p}" aria-label="Custom primary color" onchange="setPaletteTone('p',this.value)"></div>
    </div>
    <div class="th-sec"><div class="th-lbl"><span>3. Highlight tint</span><span>${pal.s.toUpperCase()}</span></div>
      <div class="th-swatches">${PT_TINTS.map(c=>`<button type="button" class="th-sw${lumHex(c)>0.45?" light-sw":""}${pal.s===c?" on":""}" style="background:${c}" aria-label="Highlight ${c}" onclick="setPaletteTone('s','${c}')"></button>`).join("")}<input class="th-pick" type="color" value="${pal.s}" aria-label="Custom highlight color" onchange="setPaletteTone('s',this.value)"></div>
    </div>
    <div class="th-foot"><button type="button" onclick="resetPaletteTheme()">Reset</button><button type="button" class="p" onclick="closeThemeModal()">Done</button></div>
  </div>`;
}
function openThemeModal(){
  const m=document.getElementById("themeModal");
  if(!m)return;
  m.hidden=false;
  renderThemeModal();
}
function closeThemeModal(){
  const m=document.getElementById("themeModal");
  if(m){m.hidden=true;m.innerHTML="";}
}
function applyTheme(arg,save){
  if(arg&&typeof arg==="object"){applyPaletteTheme(arg,save);return}
  applyPaletteTheme({b:arg?"slate":"paper",p:arg?"#4da3e3":"#1f6fa8",s:"#1f6fa8"},save);
}
function toggleTheme(){openThemeModal()}
try{applyPaletteTheme(readSavedPalette(),false)}catch(e){}
window.addEventListener("storage",e=>{
  if(e&&(e.key==="pt_palette"||e.key==="pt_theme"))applyPaletteTheme(readSavedPalette(),false);
});
window.addEventListener("load",()=>{
  snapInitial();
  try{applyPaletteTheme(readSavedPalette(),false)}catch(e){}
});
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
(function warmStockCache(){
  try{
    if(cur===0||typeof fetch!=="function"||typeof localStorage==="undefined")return;
    const wt=setTimeout(async()=>{
      try{
        if(cur===0)return;
        const c=JSON.parse(localStorage.getItem("pt_cfg")||"{}");
        if(!c||!c.url||!c.key)return;
        const raw=localStorage.getItem("pt_stock_cache");
        if(raw){
          const p=JSON.parse(raw);
          if(p&&p.data&&typeof p.ts==="number"&&Date.now()-p.ts<90000)return;
        }
        const now=new Date(),pad=n=>String(n).padStart(2,"0");
        const td=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
        const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,action:"stockload",fresh:false,today:td})});
        const j=await r.json();
        if(j&&j.ok){
          const s=JSON.stringify({ts:Date.now(),data:j});
          try{localStorage.setItem("pt_stock_cache",s)}catch(e){}
          try{sessionStorage.setItem("pt_stock_cache",s)}catch(e){}
        }
      }catch(e){}
    },1200);
    if(wt&&typeof wt.unref==="function")wt.unref();
  }catch(e){}
})();
</script>
