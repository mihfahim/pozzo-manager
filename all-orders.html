<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{--bg:#f4f7fa;--card:#ffffff;--hdr:#ffffff;--sub:#f5fafe;--in:#ffffff;--line:#dce4ec;--ink:#1c1b1f;--mut:#5f6368;--grn:#1f6fa8;--bd:#deeffb;--bad:#a8431f;--badbg:#f6e4dc;--amb:#8a5a14;--ambbg:#f6ece0;--blue:#1f6fa8;--deep:#0f3f66;--on-acc:#ffffff;--ptr-r:#cde5f7}
html.dark{color-scheme:dark;--bg:#0f141b;--card:#18212c;--hdr:#141c26;--sub:#1e2936;--in:#121923;--line:#2b3848;--ink:#edf2f7;--mut:#9aa9ba;--grn:#4da3e3;--bd:#17344d;--bad:#f28b75;--badbg:#3b1d19;--amb:#f0b865;--ambbg:#362916;--blue:#4da3e3;--deep:#b8dcf8;--on-acc:#0b1926;--ptr-r:#214563}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding-bottom:calc(108px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;text-wrap:balance}
.ptr{overflow:hidden;height:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bd);color:var(--deep);font-size:13px;font-weight:700;border-bottom:0 solid var(--line);transition:height .18s ease,opacity .18s ease;opacity:0;user-select:none}
.ptr.pulling{transition:none}
.ptr.active{opacity:1;border-bottom-width:1px}
.ptr.ready{background:var(--ptr-r)}
.ptr-ic{display:inline-block;transition:transform .15s ease;font-size:15px;line-height:1}
.ptr.ready .ptr-ic{transform:rotate(180deg)}
@keyframes ptrSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ptr.busy .ptr-ic{animation:ptrSpin .75s linear infinite}
header{position:relative;padding:12px 16px 14px;background:var(--hdr);border-bottom:3px solid var(--blue);text-align:center}
header img{display:block;margin:0 auto 4px;width:96px;max-width:34%;height:auto;background:transparent}
.theme-btn{position:absolute;right:10px;top:10px;min-height:36px;border:1px solid var(--line);background:var(--bd);color:var(--deep);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.theme-dots{display:inline-flex;align-items:center;gap:2px}
.theme-dots i{display:inline-block;width:8px;height:8px;border-radius:999px;border:1px solid rgba(128,128,128,.35);font-style:normal}
.embed .theme-btn{display:none}
header h1{font-size:22px;color:var(--deep)}
.embed header{display:none}
main{width:100%;max-width:720px;margin:0 auto;padding:14px 12px;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}

.headbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.kicker{color:var(--mut);font-size:14px;margin-bottom:2px}
.headbar h2{font-size:28px;line-height:1.15}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.btn.p{background:var(--grn);border-color:var(--grn);color:var(--on-acc)}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 14px;margin-bottom:14px;max-width:100%;overflow:hidden}
.controls-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:8px;margin-bottom:10px}
.controls-grid select,.filter-row select,.search{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--in);font:inherit;font-size:15px;font-weight:600;color:var(--ink)}
.filter-row{display:grid;grid-template-columns:1fr .8fr;gap:8px}
.search{font-weight:400}
html.dark select option{background:#18212c;color:#edf2f7}

.summary-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:13.5px;color:var(--mut)}
.summary-bar b{color:var(--ink)}

.flash{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--bd);color:var(--grn);border:1px solid #c6ddd4;border-radius:16px;padding:11px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
html.dark .flash{border-color:#28557d}
.flash.err{background:var(--badbg);color:var(--bad);border-color:#e8bfae}
html.dark .flash.err{border-color:#69322b}
.flash.warn{background:var(--ambbg);color:var(--amb);border-color:#e5cfa8}
html.dark .flash.warn{border-color:#5a4320}

.ord-list{display:flex;flex-direction:column;gap:9px}
.ord-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--in);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s ease,background-color .15s ease,transform .08s ease;box-shadow:0 1px 2px rgba(45,38,24,.04)}
html.dark .ord-btn{box-shadow:0 1px 2px rgba(0,0,0,.3)}
.ord-btn:hover,.ord-btn:focus-visible{border-color:var(--grn);background:var(--sub);outline:none}
.ord-btn:active{transform:scale(.995)}
.ord-btn .main{min-width:0;flex:1}
.ord-btn .title{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.ord-btn .meta{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.35;overflow-wrap:anywhere}
.ord-btn .side{text-align:right;flex:none;white-space:nowrap}
.ord-btn .amt{font-weight:700;font-size:16px;color:var(--ink)}
.ord-btn .cod{color:var(--mut);font-size:12.5px;margin-top:2px}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bd);color:var(--grn);font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.tag.warn{background:var(--ambbg);color:var(--amb)}
.tag.bad{background:var(--badbg);color:var(--bad)}

.skel{height:64px;border-radius:16px;background:linear-gradient(90deg,var(--sub) 25%,var(--line) 50%,var(--sub) 75%);background-size:200% 100%;animation:skPulse 1.2s ease-in-out infinite}
@keyframes skPulse{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{padding:28px 10px;text-align:center;color:var(--mut);font-size:15px}
[hidden]{display:none!important}
.th-modal{position:fixed;inset:0;background:rgba(12,18,28,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:0}
.th-sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.28)}
.th-handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 12px}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.th-head h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--ink)}
.th-close{min-width:44px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:20px;font-weight:600;cursor:pointer}
.th-prev{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.th-prev-badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--bd);color:var(--deep);font-size:12px;font-weight:700}
.th-prev-btn{padding:8px 14px;border-radius:12px;background:var(--grn);color:var(--on-acc);font-size:13px;font-weight:700}
.th-sec{margin-bottom:14px}
.th-lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
.th-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th-preset{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.th-preset.on{border-color:var(--grn);background:var(--bd);color:var(--deep)}
.th-swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.th-sub{font-size:11.5px;font-weight:600;color:var(--mut);margin:8px 0 6px}
.th-sw{width:44px;height:44px;border-radius:14px;border:2px solid rgba(128,128,128,.28);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.th-sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.th-sw.on::after{content:"✓";font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.th-sw.light-sw.on::after{color:#0f172a;text-shadow:none}
.th-pick{width:44px;height:44px;border-radius:14px;border:1.5px dashed var(--line);background:var(--sub);padding:3px;cursor:pointer}
.th-foot{display:flex;gap:10px;margin-top:16px}
.th-foot button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.th-foot button.p{background:var(--grn);border-color:var(--grn);color:var(--on-acc)}
@media (min-width:640px){.th-modal{align-items:center;padding:16px}.th-sheet{border-radius:26px;padding:16px 20px 22px}.th-handle{display:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.top small{color:var(--mut);font-size:15px}
.top h2{font-size:28px;margin:2px 0 8px}
.badge{padding:8px 14px;border-radius:999px;background:var(--bd);color:var(--grn);font-size:14px;font-weight:600;white-space:nowrap}
.badge.warn{background:var(--ambbg);color:var(--amb)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.hint{color:var(--mut);font-size:14.5px;margin:0 0 12px;line-height:1.45}
.card h3{font-size:22px;margin-bottom:8px}
.card label{display:block;font-size:14.5px;margin:12px 0 6px}
.card input:not(.search):not([type=checkbox]),.card textarea,.card select{width:100%;min-width:0;max-width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--in);font:inherit;font-size:16px;color:var(--ink)}
.controls-grid select,.filter-row select,.search{padding:10px 12px;border-radius:14px;font-size:15px}
.date-wrap{position:relative;display:block;width:100%;max-width:100%}
.date-wrap .date-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--in);font:inherit;font-size:16px;color:var(--ink);pointer-events:none;z-index:1;white-space:nowrap}
.date-wrap input[type="date"]{position:relative;z-index:2;opacity:0;width:100%;cursor:pointer}
.date-wrap:focus-within .date-face{border-color:var(--grn);outline:2px solid rgba(31,111,168,.18)}
.card textarea{resize:vertical;line-height:1.5}
.chk{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--sub);margin:12px 0 0;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;padding:0;margin:0;flex:none}
.row{display:flex;gap:12px;align-items:stretch}.row>*{flex:1;min-width:0}
.pr{background:var(--sub);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;max-width:100%}
.pr .h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);margin-bottom:10px;gap:8px}
.pr .h button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pr .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px;align-items:end}
.pr .grid>div{min-width:0}
.pr .grid label{margin:8px 0 6px;color:var(--mut)}
.sub{padding:14px 0;font-weight:600}
.btn.full{width:100%}
.btn.w{background:var(--badbg);border-color:#e8bfae;color:var(--bad)}
html.dark .btn.w{border-color:#69322b;color:#f59b87}
.stepper{display:flex;gap:8px;align-items:center;margin-top:8px}
.stepper button{width:48px;height:48px;flex:none;border-radius:16px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer}
.stepper input{text-align:center;font-weight:700;padding:12px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:16.5px;gap:12px}
.sum.m{color:var(--mut)}
.sum input{width:45%!important;text-align:right}
.sum.g{border-top:1px solid var(--line);margin-top:6px;padding-top:14px;font-size:19px;font-weight:700}
.sum.g span:last-child{font-size:26px;font-family:Georgia,serif}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));background:var(--card);border-top:1px solid var(--line);z-index:20}
.bar .btn{flex:1}.bar .btn:first-child{flex:.9}.bar .btn.p{flex:1.1}
.warn{background:var(--ambbg);border:1px solid #e8d5b8;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;color:#6b4a1b;line-height:1.45}
.warn.bad{background:var(--badbg);border-color:#e8bfae;color:var(--bad);font-weight:600}
html.dark .warn{border-color:#5a4320;color:#f3c87c}
html.dark .warn.bad{border-color:#69322b;color:#f59b87}
.err{color:var(--bad);font-size:14.5px;margin:0 0 12px}
.ok{background:var(--bd);color:var(--grn);border-radius:16px;padding:12px 14px;margin-bottom:14px;line-height:1.45}
@media print{
  body{background:#fff!important;color:#1c1b1f!important;padding:0;margin:0}
  header,.bar,#ptr,.top,.hint,button,.row,.card h3,#mmsg,.ver{display:none!important}
  main{max-width:100%;padding:0;margin:0}
  .card{border:0;box-shadow:none;padding:0;margin:0;background:#fff!important}
  #memoimg{border:0;border-radius:0;width:100%;max-width:100%;height:auto;display:block}
}
.ver{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}
</style>

<script>if(window.self!==window.top)document.documentElement.classList.add("embed");try{var _p=JSON.parse(localStorage.getItem("pt_palette")||"null");if(_p&&/^(slate|obsidian|carbon|navy|forest|espresso|plum|steel)$/.test(_p.b||""))document.documentElement.classList.add("dark");else if(!_p&&localStorage.getItem("pt_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<div id="ptr" class="ptr" aria-live="polite"><span class="ptr-ic" aria-hidden="true">&#8595;</span><span class="ptr-tx">Pull down to refresh</span></div>
<header><button id="themeBtn" class="theme-btn" type="button" onclick="openThemeModal()" aria-label="Customize theme palette"><span class="theme-dots"><i id="thDot1"></i><i id="thDot2"></i><i id="thDot3"></i></span><span>Theme</span></button><img src="icon-192.png?v=17" alt="Pozzo Toys"><h1>Pozzo Orders</h1></header>
<main id="app"></main>
<div class="bar" id="bar" hidden>
  <button class="btn" id="barL" type="button" onclick="backToOrdersList()">&larr; Back</button>
  <button class="btn p" id="barR" type="button">&#10003; Save</button>
</div>
<div id="themeModal" class="th-modal" hidden onclick="if(event.target===this)closeThemeModal()"></div>
<script>
const VER="v9";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const tk=n=>"৳ "+Math.round(Number(n)||0).toLocaleString("en-US");
function today(){const t=new Date(),p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())}
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDMY(s){
  const raw=String(s==null?"":s).trim();
  if(!raw)return "";
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso){
    const mi=Number(iso[2])-1;
    return iso[3]+"-"+(MON3[mi]||iso[2])+"-"+iso[1];
  }
  const numDmy=raw.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(numDmy){
    const mi=Number(numDmy[2])-1;
    if(mi>=0&&mi<12)return String(Number(numDmy[1])).padStart(2,"0")+"-"+MON3[mi]+"-"+numDmy[3];
  }
  const dmy=raw.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[\s-]+(\d{4})$/);
  if(dmy){
    const mi=MON3.findIndex(x=>x.toUpperCase()===dmy[2].toUpperCase());
    if(mi>-1)return String(Number(dmy[1])).padStart(2,"0")+"-"+MON3[mi]+"-"+dmy[3];
  }
  return raw;
}
const cfg=()=>{try{return JSON.parse(localStorage.getItem("pt_cfg")||"{}")}catch(e){return{}}};
const ALL_MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthYearKey=(m,y)=>String(y)+"-"+String(m).padStart(2,"0");

const tdInit=today();
let state={
  month:Number(tdInit.slice(5,7)),
  year:Number(tdInit.slice(0,4)),
  statusFilter:"all",
  q:"",
  loading:true,
  syncing:false,
  err:"",
  isWarn:false,
  orders:[],
  cache:{}
};

function readMonthCache(ym){
  if(state.cache[ym])return state.cache[ym];
  try{
    const raw=sessionStorage.getItem("pt_mo_"+ym);
    if(!raw)return null;
    const p=JSON.parse(raw);
    if(p&&Array.isArray(p.orders)){state.cache[ym]=p;return p}
  }catch(e){}
  return null;
}
function saveMonthCache(ym,orders){
  const entry={ts:Date.now(),orders:orders};
  state.cache[ym]=entry;
  try{sessionStorage.setItem("pt_mo_"+ym,JSON.stringify(entry))}catch(e){}
}
function clearAllMonthCache(){
  state.cache={};
  try{
    if(typeof sessionStorage!=="undefined"){
      for(let i=sessionStorage.length-1;i>=0;i--){
        const k=sessionStorage.key(i);
        if(k&&k.startsWith("pt_mo_"))sessionStorage.removeItem(k);
      }
    }
  }catch(e){}
}

async function api(payload){
  const c=cfg();if(!c.url||!c.key)return {ok:false,error:"nocfg"};
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
  try{
    const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:c.key},payload)),signal:ac.signal});
    return await r.json();
  }catch(e){return {ok:false,error:e&&e.name==="AbortError"?"slow":"no connection"}}
  finally{clearTimeout(t)}
}

function goTab(tab,extra){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(Object.assign({type:"pozzo:switch-tab",tab:tab},extra||{}),"*");
      return;
    }
  }catch(e){}
  const map={dashboard:"dashboard.html",dispatch:"dispatch.html",sale:"orders.html",sales:"orders.html",stock:"stock.html",orders:"all-orders.html"};
  if(map[tab]){
    const suffix=(tab==="sale"||tab==="sales")&&extra&&extra.orderId?"#order="+encodeURIComponent(extra.orderId):"";
    window.location.href=map[tab]+suffix;
  }
}

const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?0:n};
const MON_ID=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function fmtDMYStamp(s){
  const raw=String(s==null?"":s).trim();
  if(!raw)return "";
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})(?:[T\s]+(\d{2}:\d{2}))?/);
  if(m)return fmtDMY(m[1])+(m[2]?" "+m[2]:"");
  return fmtDMY(raw);
}
function fmtDMYInText(s){
  return String(s==null?"":s)
    .replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,(_,y,m,d)=>fmtDMY(y+"-"+m+"-"+d))
    .replace(/\b(\d{1,2})-(\d{2})-(\d{4})\b/g,(_,d,m,y)=>fmtDMY(d+"-"+m+"-"+y));
}

function makeReqId(prefix){return (prefix||"req")+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function errText(e){
  if(e==="nocfg")return "Not connected to Google Sheet yet.";
  if(e==="no connection")return "Could not reach the Google Sheet. Check your internet and try again.";
  if(e==="slow")return "The Google Sheet took too long to answer. Please try again.";

function normalizeOrderId(raw){
  let id=String(raw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!id)return "";
  if(/^\d+$/.test(id)){
    const td=today(),y=td.slice(2,4),mi=parseInt(td.slice(5,7),10)-1;
    return "PZ"+y+MON_ID[mi]+"-"+("000"+id).slice(-3);
  }
  return id;
}
function splitItemVariant(fullName){
  const raw=String(fullName||"").trim();
  const m=raw.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  return m?{name:m[1].trim(),variant:m[2].trim()}:{name:raw,variant:""};
}
function fullItemName(it){
  const base=String(it.name||"").trim();
  const v=String(it.variant||"").trim();
  if(!v)return base;
  if(base.toLowerCase().indexOf("("+v.toLowerCase()+")")>-1)return base;
  return base+" ("+v+")";
}

function syncLocalOrder(ord,oldId){

  try{

    const idx=list.findIndex(x=>String(x.id||"").toUpperCase()===String(tgt).toUpperCase());
    const entry={id:ord.id,date:ord.date,name:ord.name,phone:ord.phone,phone2:ord.phone2||"",address:ord.address,items:ord.items||[],sub:ord.sub,discount:ord.discount,delivery:ord.delivery,advance:ord.advance||0,total:ord.total,status:ord.status||"Active"};
    if(idx>=0)list[idx]=Object.assign({},list[idx],entry);else list.push(entry);

function edRmItem(i){
  if(!EDIT)return;
  if(EDIT.items.length<=1){const e=$("#err");if(e)e.textContent="An order must keep at least 1 product line.";return}
  EDIT.items.splice(i,1);edItems();edCalc();

function edCalc(){
  if(!EDIT)return;
  const isCanc=EDIT.status==="Cancelled";
  let sub=0;
  EDIT.items.forEach((it,i)=>{
    const lineVal=isCanc?0:(it.qty*it.price);
    sub+=lineVal;
    const e=$("#eds"+i);if(e)e.textContent=tk(lineVal);
  });
  const disc=isCanc?0:(Number(EDIT.discount)||0);
  const del=isCanc?0:(Number(EDIT.delivery)||0);
  const adv=isCanc?0:(Number(EDIT.advance)||0);
  const total=Math.max(0,sub-disc+del);
  const cod=Math.max(0,total-adv);
  EDIT.sub=sub;EDIT.total=total;
  $("#ed_st").textContent=tk(sub);
  $("#ed_gt").textContent=tk(total);
  $("#ed_cod").textContent=tk(cod);
  const b=$("#edbadge");
  if(b){b.textContent=EDIT.status;b.className=statusBadgeClass(EDIT.status)}
}

  edCalc();
  const finalItems=usedItems.map(i=>({name:fullItemName(i),qty:EDIT.status==="Cancelled"?0:Number(i.qty)||0,price:Number(i.price)||0,returned:Number(i.returned)||0}));

    "• Customer: "+name+" ("+phone+")\n"+

    discount:Number(EDIT.discount)||0,

function computeReturnPreview(order,lines,sellerDelivery){
  const clamped=lines.map(l=>{
    const avail=Math.max(0,Math.floor(Number(l.avail)||0));
    const retQty=Math.max(0,Math.min(avail,Math.floor(Number(l.retQty)||0)));
    return{retQty:retQty,keptQty:avail-retQty,price:Number(l.price)||0};
  });
  const returnedUnits=clamped.reduce((s,x)=>s+x.retQty,0);
  const keptUnits=clamped.reduce((s,x)=>s+x.keptQty,0);
  const returnedSub=clamped.reduce((s,x)=>s+x.retQty*x.price,0);
  const newSub=clamped.reduce((s,x)=>s+x.keptQty*x.price,0);
  const isFull=keptUnits<=0;
  const newDiscount=isFull?0:Math.min(Number(order.discount)||0,newSub);
  const sellerDel=Math.max(0,Math.round((Number(sellerDelivery)||0)*100)/100);
  const newDelivery=Math.max(0,Math.round(((Number(order.delivery)||0)-sellerDel)*100)/100);
  const newTotal=Math.max(0,newSub-newDiscount+newDelivery);
  const newCod=Math.max(0,newTotal-(Number(order.advance)||0));
  return{clamped,returnedUnits,keptUnits,returnedSub,newSub,isFull,newDiscount,sellerDel,newDelivery,newTotal,newCod};
}

function calcReturn(){
  if(!RSTATE)return;
  const o=RSTATE.order;
  const p=computeReturnPreview(o,RSTATE.lines,RSTATE.sellerDelivery);
  p.clamped.forEach((c,i)=>{
    const k=$("#rk"+i),v=$("#rv"+i);
    if(k)k.textContent=c.keptQty;
    if(v)v.textContent=c.retQty>0?"− "+tk(c.retQty*c.price):tk(0);
  });
  $("#rretv").textContent=p.returnedSub>0?"− "+tk(p.returnedSub):tk(0);
  $("#rst").textContent=tk(p.newSub);
  $("#rdisc").textContent=tk(p.newDiscount)+(p.isFull&&o.discount>0?" (reversed on full return)":"");
  $("#rcdel").textContent=tk(p.newDelivery);
  $("#rsdview").textContent=tk(p.sellerDel);
  $("#rgt").textContent=tk(p.newTotal);
  $("#rcod").textContent=tk(p.newCod);

  const b=$("#rbadge"),w=$("#rwarn");
  if(p.returnedUnits===0){
    b.textContent="Select items";b.className="badge";
  }else if(p.isFull){
    b.textContent="Full return · "+p.returnedUnits+" pcs";b.className="badge bad";
  }else{
    b.textContent="Partial return · "+p.returnedUnits+" pcs";b.className="badge warn";
  }
  if(p.sellerDel>o.delivery){
    w.hidden=false;
    w.textContent="Delivery paid by you ("+tk(p.sellerDel)+") is more than the customer delivery charge ("+tk(o.delivery)+"). Customer delivery on this order will become ৳ 0.";
  }else{
    w.hidden=true;
  }
}

async function drawMemo(o,noLogo){
  const W=800,P=44,IN=W-2*P;
  const SANS='"Segoe UI","Noto Sans Bengali","Noto Sans",system-ui,sans-serif';
  const BLUE="#1F6FA8",DEEP="#0F3F66",INK="#1C1B1F",MUT="#5F6368",LINE="#E3E5E8",CHIP="#DEEFFB",SOFT="#F5FAFE",COD="#E9F4FC",CODB="#BFDDF2";
  const items=o.items||[];
  const sub=items.reduce((s,i)=>s+i.qty*i.price,0);
  const disc=o.discount||0,del=o.delivery||0,adv=o.advance||0;
  const total=sub-disc+del,cod=Math.max(0,total-adv);
  const logo=noLogo?null:await memoLogo();
  const cv=document.createElement("canvas"),cx=cv.getContext("2d");
  const fmtn=n=>Math.round(n).toLocaleString("en-US");
  const wrap=(text,font,maxW)=>{
    cx.font=font;const lines=[];
    String(text).split("\n").forEach(par=>{
      let cur="";
      par.split(" ").forEach(w=>{
        const t=cur?cur+" "+w:w;
        if(cx.measureText(t).width<=maxW){cur=t;return}
        if(cur){lines.push(cur);cur=""}
        if(cx.measureText(w).width<=maxW){cur=w;return}
        let piece="";
        for(const ch of w){if(cx.measureText(piece+ch).width>maxW){lines.push(piece);piece=ch}else piece+=ch}
        cur=piece;
      });
      lines.push(cur);
    });
    return lines;
  };
  function run(draw){
    const T=(txt,x,yy,font,color,align)=>{if(!draw)return;cx.font=font;cx.fillStyle=color;cx.textAlign=align||"left";cx.textBaseline="alphabetic";cx.fillText(txt,x,yy)};
    const RR=(x,yy,w,h,r,fill,stroke)=>{
      if(!draw)return;
      cx.beginPath();
      if(cx.roundRect)cx.roundRect(x,yy,w,h,r);else cx.rect(x,yy,w,h);
      if(fill){cx.fillStyle=fill;cx.fill()}
      if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.stroke()}
    };
    const HR=yy=>{if(draw){cx.fillStyle=LINE;cx.fillRect(P,yy,IN,1)}};
    let y=22;
    const headerHeight=110;
    if(logo&&logo.naturalWidth){
      const sc=Math.min(headerHeight/logo.naturalHeight,220/logo.naturalWidth),lw=logo.naturalWidth*sc,lh=logo.naturalHeight*sc;
      if(draw)cx.drawImage(logo,P,y+(headerHeight-lh)/2,lw,lh);
    }
    T(SHOP.name,W-P,y+50,"700 40px "+SANS,BLUE,"right");
    T(SHOP.phone,W-P,y+86,"500 24px "+SANS,MUT,"right");
    y+=headerHeight+14;
    HR(y);
    y+=24;
    T("Cash memo",P,y+22,"600 32px "+SANS,BLUE);
    cx.font="600 22px "+SANS;const cw=cx.measureText(o.id).width+36;
    RR(W-P-cw,y-6,cw,40,20,CHIP);
    T(o.id,W-P-cw/2,y+22,"600 22px "+SANS,DEEP,"center");
    y+=64;T(memoDate(o.date),W-P,y,"400 20px "+SANS,MUT,"right");
    y+=30;
    const addr=wrap(o.address||"-","400 22px "+SANS,IN-48);
    const ch=26+34+34+addr.length*30+14;
    RR(P,y,IN,ch,22,SOFT);
    let cy=y+40;
    T(o.name||"-",P+24,cy,"600 25px "+SANS,INK);cy+=36;
    T(o.phone||"-",P+24,cy,"400 22px "+SANS,MUT);cy+=34;
    addr.forEach(ln=>{T(ln,P+24,cy,"400 22px "+SANS,MUT);cy+=30});
    y+=ch+30;
    items.forEach(it=>{
      const qp=fmtn(it.price)+" × "+it.qty,amt=fmtn(it.price*it.qty);
      cx.font="400 21px "+SANS;const qw=cx.measureText(qp).width;
      const ls=wrap(it.name,"400 22px "+SANS,IN-130-qw-30);
      ls.forEach((ln,i)=>T(ln,P+2,y+i*30,"400 22px "+SANS,INK));
      T(qp,W-P-120,y,"400 21px "+SANS,MUT,"right");
      T(amt,W-P-2,y,"500 22px "+SANS,INK,"right");
      y+=ls.length*30+10;HR(y-8);y+=14;
    });
    y+=4;
    const row=(k,v,big)=>{
      T(k,P+2,y,big?"600 26px "+SANS:"400 22px "+SANS,big?INK:MUT);
      T(v,W-P-2,y,big?"600 26px "+SANS:"400 22px "+SANS,INK,"right");
      y+=big?46:38;
    };
    row("Product value",fmtn(sub));
    if(disc>0)row("Discount","− "+fmtn(disc));
    row("Delivery",del>0?fmtn(del):"Free");
    row("Total",fmtn(total),true);
    if(adv>0)row("Advance paid","− "+fmtn(adv));
    y+=6;const bh=cod>0?104:116;
    RR(P,y,IN,bh,28,COD,CODB);
    if(cod>0){
      T("COD amount due",P+28,y+62,"600 24px "+SANS,DEEP);
      T("৳"+fmtn(cod),W-P-28,y+68,"600 48px "+SANS,BLUE,"right");
    }else{
      T("Paid in full",W/2,y+54,"600 36px "+SANS,BLUE,"center");
      T("No cash to collect",W/2,y+92,"400 20px "+SANS,MUT,"center");
    }
    y+=bh+46;
    T("Thank you for shopping with Pozzo Toys",W/2,y,"400 20px "+SANS,MUT,"center");
    return y+44;
  }
  const H=run(false);
  cv.width=W;cv.height=H;
  cx.fillStyle="#FFFFFF";cx.fillRect(0,0,W,H);
  run(true);
  try{cv.toDataURL("image/png")}catch(e){if(!noLogo)return drawMemo(o,true)}
  return cv;
}

function statusTag(st){
  if(!st||st==="Active")return "";
  if(st==="Partial Return")return `<span class="tag warn">${esc(st)}</span>`;
  return `<span class="tag bad">${esc(st)}</span>`;

let _fetchReqSeq=0;
async function loadMonthOrders(force){
  const c=cfg();
  const ym=monthYearKey(state.month,state.year);
  if(!c.url||!c.key){
    state.loading=false;
    state.syncing=false;
    state.orders=[];
    render();
    return;
  }

  const cached=!force?readMonthCache(ym):null;
  if(cached){
    state.orders=cached.orders;
    state.loading=false;
    state.err="";
    state.isWarn=false;
    if(Date.now()-cached.ts<90000){
      state.syncing=false;
      render();
      return;
    }
    state.syncing=true;
    render();
  }else{
    state.loading=!state.orders.length||force||!cached;
    if(!cached)state.orders=[];
    state.syncing=!!state.orders.length;
    state.err="";
    state.isWarn=false;
    render();
  }

  const seq=++_fetchReqSeq;
  const j=await api({action:"monthorders",month:ym,today:today()});
  if(seq!==_fetchReqSeq||monthYearKey(state.month,state.year)!==ym)return;

  if(!j.ok&&/reading 'date'|unsupported action|unknown action/i.test(String(j.error||""))){
    const fb=await api({action:"recentorders",limit:50,today:today()});
    if(seq!==_fetchReqSeq||monthYearKey(state.month,state.year)!==ym)return;
    state.loading=false;
    state.syncing=false;
    if(fb&&fb.ok&&Array.isArray(fb.orders)){
      const filtered=fb.orders.filter(o=>String(o.date||"").slice(0,7)===ym);
      state.orders=filtered;
      state.isWarn=true;
      state.err=filtered.length
        ?"Showing latest orders only — redeploy pozzo-script.txt (New version) to load all orders for every month."
        :"Redeploy pozzo-script.txt (New version) in Google Apps Script to browse orders from this month.";
      render();
      return;
    }
    state.isWarn=false;
    state.err="Please update & deploy pozzo-script.txt (New version) in Google Apps Script to browse all orders by month.";
    state.orders=[];
    render();
    return;
  }

  state.loading=false;
  state.syncing=false;
  if(!j.ok){
    state.isWarn=false;
    state.err=j.error==="no connection"?"Could not reach Google Sheet. Check your internet and pull down to refresh."
      :j.error==="slow"?"Google Sheet is slow to respond. Pull down to try again."
      :(j.error||"Could not load orders for that month.");
    if(!cached)state.orders=[];
  }else{
    const list=Array.isArray(j.orders)?j.orders:[];
    saveMonthCache(ym,list);
    state.orders=list;
    state.err="";
    state.isWarn=false;
  }
  render();
}

function changePeriod(month,year){
  state.month=Number(month);
  state.year=Number(year);
  return loadMonthOrders(false);
}

function filteredOrders(){
  const ql=state.q.trim().toLowerCase();
  return (state.orders||[]).filter(o=>{
    const st=o.status||"Active";
    if(state.statusFilter!=="all"&&st!==state.statusFilter)return false;
    if(!ql)return true;
    return (String(o.id||"")+" "+String(o.name||"")+" "+String(o.phone||"")+" "+String(o.date||"")+" "+fmtDMY(o.date)).toLowerCase().includes(ql);
  });
}

function renderOrderButtonsHtml(list){

(function initPTR(onRefresh){
  if(typeof document==="undefined")return;
  let el=typeof document.getElementById==="function"?document.getElementById("ptr"):null;
  const tx=()=>el&&el.querySelector?el.querySelector(".ptr-tx"):null;
  const ic=()=>el&&el.querySelector?el.querySelector(".ptr-ic"):null;
  let sx=0,sy=0,lock="",pull=0,busy=false;
  const THRESH=52;
  function setVisual(h,cls,text,glyph){
    if(!el)return;
    el.className="ptr"+(cls?" "+cls:"");
    if(el.style)el.style.height=h+"px";
    const t=tx();if(t&&text)t.textContent=text;
    const g=ic();if(g&&glyph)g.innerHTML=glyph;
  }
  async function triggerPullRefresh(){
    if(busy)return;
    busy=true;
    setVisual(44,"active busy","Refreshing…","&#8635;");
    const t0=Date.now();
    try{await onRefresh()}catch(e){}
    finally{
      const wait=Math.max(0,260-(Date.now()-t0));
      const tm=setTimeout(()=>{busy=false;setVisual(0,"","Pull down to refresh","&#8595;")},wait);
      if(tm&&typeof tm.unref==="function")tm.unref();
    }
  }
  window.triggerPullRefresh=triggerPullRefresh;
  const scrollTop=()=>Math.max(window.scrollY||0,(document.documentElement&&document.documentElement.scrollTop)||0,(document.body&&document.body.scrollTop)||0);
  document.addEventListener("touchstart",e=>{
    if(busy||!e.touches||e.touches.length!==1)return;
    if(scrollTop()>2){lock="up";return}
    const tgt=e.target;
    if(tgt&&tgt.closest&&(tgt.closest("input, textarea, select"))){lock="modal";return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock="";pull=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(busy||lock==="up"||lock==="h"||lock==="modal"||!e.touches||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!lock){
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){lock="h";return}
      if(dy<-6){lock="up";return}
      if(dy>8&&Math.abs(dy)>Math.abs(dx)){if(scrollTop()>2){lock="up";return}lock="v"}else return;
    }
    if(lock==="v"){
      if(dy<=0){pull=0;setVisual(0,"pulling","","");return}
      pull=Math.min(76,Math.round(dy*0.55));
      if(e.cancelable)e.preventDefault();
      setVisual(pull,"pulling active"+(pull>=THRESH?" ready":""),pull>=THRESH?"Release to refresh":"Pull down to refresh","&#8595;");
    }
  },{passive:false});
  function onEnd(){
    if(busy)return;
    const goRef=(lock==="v"&&pull>=THRESH);
    lock="";pull=0;
    if(goRef)triggerPullRefresh();
    else setVisual(0,"","Pull down to refresh","&#8595;");
  }
  document.addEventListener("touchend",onEnd,{passive:true});
  document.addEventListener("touchcancel",onEnd,{passive:true});
})(()=>{
  if(DETAIL&&DETAIL.order&&!EDIT&&!RSTATE&&!MEMO)return loadOrderDetail(DETAIL.order.id,"Order refreshed from sheet.");
  if(EDIT||RSTATE||MEMO)return;
  return loadMonthOrders(true);
});

  const acc=dark?(lumHex(rawP)<0.24?mixHex(rawP,"#ffffff",0.36):rawP):(lumHex(rawP)>0.38?mixHex(rawP,"#0e1726",0.30):rawP);
  const deep=dark?(lumHex(rawS)<0.45?mixHex(rawS,"#ffffff",0.60):mixHex(rawS,"#ffffff",0.25)):(lumHex(rawS)>0.22?mixHex(rawS,"#09131d",0.48):mixHex(rawS,"#09131d",0.22));
  const sub=dark?mixHex(base.card,rawS,0.12):mixHex(base.card,rawS,0.065);
  const bd=dark?mixHex(base.bg,rawS,0.26):mixHex(base.card,rawS,0.14);
  const ptrR=dark?mixHex(base.bg,rawS,0.36):mixHex(base.card,rawS,0.24);
  const onAcc=lumHex(acc)>(dark?0.42:0.44)?"#0b1926":"#ffffff";
  return{dark,base,acc,vars:{"--bg":base.bg,"--card":base.card,"--hdr":base.hdr,"--sub":sub,"--in":base.inp,"--line":base.line,"--ink":base.ink,"--mut":base.mut,"--grn":acc,"--blue":acc,"--deep":deep,"--bd":bd,"--ptr-r":ptrR,"--on-acc":onAcc,"--bad":dark?"#f28b75":"#a8431f","--badbg":dark?"#3b1d19":"#f6e4dc","--amb":dark?"#f0b865":"#8a5a14","--ambbg":dark?"#362916":"#f6ece0"}};
}
let curPalette=readSavedPalette();
function applyPaletteTheme(pal,save){
  try{
    curPalette=normPal(pal);
    const t=computeThemeVars(curPalette);
    const root=document&&document.documentElement;
    if(root&&root.classList)root.classList.toggle("dark",t.dark);
    if(root&&root.style&&typeof root.style.setProperty==="function")Object.keys(t.vars).forEach(k=>root.style.setProperty(k,t.vars[k]));
    const d1=document.getElementById("thDot1"),d2=document.getElementById("thDot2"),d3=document.getElementById("thDot3");
    if(d1)d1.style.background=t.base.bg;if(d2)d2.style.background=t.acc;if(d3)d3.style.background=curPalette.s;
    if(save){
      try{localStorage.setItem("pt_palette",JSON.stringify(curPalette))}catch(e){}
      try{localStorage.setItem("pt_theme",t.dark?"dark":"light")}catch(e){}
    }
  }catch(e){}
}
function setPalettePreset(id){const pr=PT_PRESETS.find(x=>x.id===id);if(!pr)return;applyPaletteTheme({b:pr.b,p:pr.p,s:pr.s},true);renderThemeModal()}
function setPaletteTone(slot,val){const next=Object.assign({},curPalette);next[slot]=val;applyPaletteTheme(next,true);renderThemeModal()}
function resetPaletteTheme(){applyPaletteTheme({b:"paper",p:"#1f6fa8",s:"#1f6fa8"},true);renderThemeModal()}
function renderThemeModal(){
  const m=document.getElementById("themeModal");if(!m||m.hidden)return;
  const bases=Object.values(PT_BASES),pal=curPalette;
  m.innerHTML=`<div class="th-sheet" role="dialog" aria-modal="true" aria-labelledby="thTitle"><div class="th-handle" aria-hidden="true"></div><div class="th-head"><h2 id="thTitle">Customize theme</h2><button class="th-close" type="button" onclick="closeThemeModal()" aria-label="Close theme customizer">&times;</button></div><div class="th-prev"><div><div style="font-weight:700;font-size:14.5px">Live preview</div><span class="th-prev-badge">19-Nov-2026</span></div><span class="th-prev-btn">Save order</span></div><div class="th-sec"><div class="th-lbl"><span>Starter combinations</span></div><div class="th-presets">${PT_PRESETS.map(pr=>{const on=pal.b===pr.b&&pal.p===pr.p&&pal.s===pr.s;return`<button type="button" class="th-preset${on?" on":""}" onclick="setPalettePreset('${pr.id}')"><span class="theme-dots"><i style="background:${PT_BASES[pr.b].bg}"></i><i style="background:${pr.p}"></i><i style="background:${pr.s}"></i></span><span>${pr.name}</span></button>`}).join("")}</div></div><div class="th-sec"><div class="th-lbl"><span>1. Surface tone</span><span>${PT_BASES[pal.b].name}</span></div><div class="th-sub">Light surfaces</div><div class="th-swatches">${bases.filter(b=>!b.dark).map(b=>`<button type="button" class="th-sw light-sw${pal.b===b.id?" on":""}" style="background:${b.bg}" title="${b.name}" aria-label="${b.name}" onclick="setPaletteTone('b','${b.id}')"></button>`).join("")}</div><div class="th-sub">Dark surfaces</div><div class="th-swatches">${bases.filter(b=>b.dark).map(b=>`<button type="button" class="th-sw${pal.b===b.id?" on":""}" style="background:${b.bg}" title="${b.name}" aria-label="${b.name}" onclick="setPaletteTone('b','${b.id}')"></button>`).join("")}</div></div><div class="th-sec"><div class="th-lbl"><span>2. Primary accent</span><span>${pal.p.toUpperCase()}</span></div><div class="th-swatches">${PT_ACCENTS.map(c=>`<button type="button" class="th-sw${lumHex(c)>0.45?" light-sw":""}${pal.p===c?" on":""}" style="background:${c}" aria-label="Primary ${c}" onclick="setPaletteTone('p','${c}')"></button>`).join("")}<input class="th-pick" type="color" value="${pal.p}" aria-label="Custom primary color" onchange="setPaletteTone('p',this.value)"></div></div><div class="th-sec"><div class="th-lbl"><span>3. Highlight tint</span><span>${pal.s.toUpperCase()}</span></div><div class="th-swatches">${PT_TINTS.map(c=>`<button type="button" class="th-sw${lumHex(c)>0.45?" light-sw":""}${pal.s===c?" on":""}" style="background:${c}" aria-label="Highlight ${c}" onclick="setPaletteTone('s','${c}')"></button>`).join("")}<input class="th-pick" type="color" value="${pal.s}" aria-label="Custom highlight color" onchange="setPaletteTone('s',this.value)"></div></div><div class="th-foot"><button type="button" onclick="resetPaletteTheme()">Reset</button><button type="button" class="p" onclick="closeThemeModal()">Done</button></div></div>`;
}
function openThemeModal(){const m=document.getElementById("themeModal");if(!m)return;m.hidden=false;renderThemeModal()}
function closeThemeModal(){const m=document.getElementById("themeModal");if(m){m.hidden=true;m.innerHTML=""}}
function applyTheme(arg,save){if(arg&&typeof arg==="object"){applyPaletteTheme(arg,save);return}applyPaletteTheme({b:arg?"slate":"paper",p:arg?"#4da3e3":"#1f6fa8",s:"#1f6fa8"},save)}
function toggleTheme(){openThemeModal()}
try{applyPaletteTheme(readSavedPalette(),false)}catch(e){}
try{window.addEventListener("message",e=>{if(e&&e.data&&e.data.type==="pozzo:theme")applyPaletteTheme(e.data.palette||{b:e.data.dark?"slate":"paper",p:e.data.dark?"#4da3e3":"#1f6fa8",s:"#1f6fa8"},false)})}catch(e){}
try{window.addEventListener("storage",e=>{if(e&&(e.key==="pt_palette"||e.key==="pt_theme"))applyPaletteTheme(readSavedPalette(),false)})}catch(e){}
</script>
