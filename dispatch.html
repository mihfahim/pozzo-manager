<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b4f48">
<title>Pozzo Manager – Dispatch</title>
<meta name="description" content="Pozzo Toys Dispatch: customer packing list, product variants and quantities, courier parcel export, and Steadfast label converter.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=17">
<link rel="apple-touch-icon" href="icon-192.png?v=17">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#f4f7fa;--card:#ffffff;--hdr:#ffffff;--sub:#f5fafe;--in:#ffffff;--line:#dce4ec;--ink:#1c1b1f;--mut:#5f6368;--grn:#1f6fa8;--bd:#deeffb;--bad:#a8431f;--badbg:#f6e4dc;--amb:#8a5a14;--ambbg:#f6ece0;--blue:#1f6fa8;--deep:#0f3f66;--on-acc:#ffffff;--ptr-r:#cde5f7}
html.dark{color-scheme:dark;--bg:#0f141b;--card:#18212c;--hdr:#141c26;--sub:#1e2936;--in:#121923;--line:#2b3848;--ink:#edf2f7;--mut:#9aa9ba;--grn:#4da3e3;--bd:#17344d;--bad:#f28b75;--badbg:#3b1d19;--amb:#f0b865;--ambbg:#362916;--blue:#4da3e3;--deep:#b8dcf8;--on-acc:#0b1926;--ptr-r:#214563}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;text-wrap:balance}
.ptr{overflow:hidden;height:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bd);color:var(--deep);font-size:13px;font-weight:700;border-bottom:0 solid var(--line);transition:height .18s ease,opacity .18s ease;opacity:0;user-select:none}
.ptr.pulling{transition:none}
.ptr.active{opacity:1;border-bottom-width:1px}
.ptr.ready{background:var(--ptr-r)}
.ptr-ic{display:inline-block;transition:transform .15s ease;font-size:15px;line-height:1}
.ptr.ready .ptr-ic{transform:rotate(180deg)}
@keyframes ptrSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ptr.busy .ptr-ic{animation:ptrSpin .75s linear infinite}
header{position:relative;padding:12px 16px 14px;background:var(--hdr);border-bottom:3px solid var(--blue);text-align:center}
header img{display:block;margin:0 auto 4px;width:96px;max-width:34%;height:auto;background:transparent}
.theme-btn{position:absolute;right:10px;top:10px;min-height:36px;border:1px solid var(--line);background:var(--bd);color:var(--deep);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.theme-dots{display:inline-flex;align-items:center;gap:2px}
.theme-dots i{display:inline-block;width:8px;height:8px;border-radius:999px;border:1px solid rgba(128,128,128,.35);font-style:normal}
.embed .theme-btn{display:none}
header h1{font-size:22px;color:var(--deep)}
.embed header{display:none}
main{width:100%;max-width:920px;margin:0 auto;padding:14px 12px;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}

/* Top Bar */
.headbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.kicker{color:var(--mut);font-size:14px;margin-bottom:2px}
.headbar h2{font-size:28px;line-height:1.15}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--in);font:inherit;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.btn.p{background:var(--grn);border-color:var(--grn);color:var(--on-acc)}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--grn);outline-offset:2px}

/* Filter Tabs & Search */
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;max-width:100%}
.seg{display:flex;flex-wrap:nowrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--grn);color:var(--on-acc)}
.ctrl-right{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between;flex-wrap:wrap}
.period-sel{display:inline-flex;align-items:center;background:var(--in);border:1.5px solid var(--grn);border-radius:14px;padding:4px 10px;min-height:44px;box-shadow:0 1px 3px rgba(31,111,168,.1)}
html.dark .period-sel{box-shadow:0 1px 3px rgba(0,0,0,.3)}
.period-sel label{font-size:13px;color:var(--grn);font-weight:700;margin-right:6px;white-space:nowrap}
.period-sel select{border:0;background:var(--in);padding:6px 20px 6px 4px;font:inherit;font-size:14px;font-weight:700;color:var(--deep);cursor:pointer;outline:none;appearance:auto}
html.dark .period-sel select option{background:#18212c;color:#edf2f7}
.custom-dates{display:flex;gap:8px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:6px;flex-wrap:wrap}
.custom-dates label{font-size:12px;color:var(--mut);font-weight:600}
.custom-dates input[type="date"]{min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--in);font:inherit;font-size:13px;color:var(--ink)}
.custom-dates .date-wrap{position:relative;display:inline-block;min-width:148px}
.custom-dates .date-wrap .date-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--in);font:inherit;font-size:13px;color:var(--ink);pointer-events:none;z-index:1;white-space:nowrap}
.custom-dates .date-wrap input[type="date"]{position:relative;z-index:2;opacity:0;width:100%;cursor:pointer}
.custom-dates .date-wrap:focus-within .date-face{border-color:var(--grn);outline:2px solid rgba(31,111,168,.18)}
.search{flex:1;min-width:160px;max-width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--in);font:inherit;font-size:15px;color:var(--ink)}

/* Alerts & Banners */
.flash{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--bd);color:var(--grn);border:1px solid #c6ddd4;border-radius:16px;padding:12px 15px;margin-bottom:14px;font-size:14px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
html.dark .flash{border-color:#28557d}
.flash.err{background:var(--badbg);color:var(--bad);border-color:#e8bfae}
html.dark .flash.err{border-color:#69322b}
.flash.warn{background:var(--ambbg);color:var(--amb);border-color:#e5cfa8}
html.dark .flash.warn{border-color:#5a4320}

/* Customer Name Buttons Queue */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 14px;margin-bottom:16px;max-width:100%;overflow:hidden}
.queue-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;margin-bottom:12px}
.queue-head h3{font-size:19px}
.queue-hint{font-size:13px;color:var(--mut)}
.btn-grid{display:flex;flex-direction:column;gap:9px;max-width:100%}
.order-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:100%;overflow:hidden;box-sizing:border-box;min-height:64px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--in);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s ease,background-color .15s ease,transform .08s ease;box-shadow:0 1px 2px rgba(45,38,24,.05)}
html.dark .order-btn{box-shadow:0 1px 2px rgba(0,0,0,.3)}
.order-btn:hover{border-color:var(--grn);background:#fff}
html.dark .order-btn:hover{background:#1c2734}
.order-btn:active{transform:scale(.995)}
.order-btn:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.order-btn.packed{background:var(--sub);opacity:.88}
.ob-left{min-width:0;flex:1;overflow:hidden}
.cname{display:block;font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.ob-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.oid-chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bd);color:var(--grn);font-size:12px;font-weight:700;letter-spacing:.02em}
.order-btn.packed .oid-chip{background:var(--line);color:var(--mut)}
.st-chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--ambbg);color:var(--amb);font-size:11.5px;font-weight:600}
.pack-chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--mut);font-size:11.5px;font-weight:600}
.ob-right{text-align:right;flex:none;white-space:nowrap}
.ob-pcs{display:block;font-weight:700;font-size:14.5px;color:var(--grn)}
.order-btn.packed .ob-pcs{color:var(--mut)}
.ob-sub{display:block;font-size:12px;color:var(--mut);margin-top:2px}

/* Packing Window Modal */
.modal{position:fixed;inset:0;background:rgba(30,25,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
html.dark .modal{background:rgba(5,10,16,.72)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px;padding:22px 20px 22px;max-height:90vh;overflow:auto;border:1px solid var(--line);box-shadow:0 12px 32px rgba(20,18,12,.22);-webkit-overflow-scrolling:touch}
html.dark .sheet{box-shadow:0 12px 32px rgba(0,0,0,.55)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet-kicker{font-size:13px;font-weight:700;color:var(--grn);margin-bottom:3px}
.sheet h3{font-size:24px;line-height:1.15}
.sheet-cust{color:var(--mut);font-size:14px;margin-top:5px;line-height:1.45}
.icon-close{min-width:40px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--in);color:var(--ink);font:inherit;font-size:18px;font-weight:600;cursor:pointer;flex:none}

.pack-sec-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.pack-sec-head span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.pack-list{display:flex;flex-direction:column;gap:8px}
.pack-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--in);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background-color .12s ease,border-color .12s ease}
.pack-item.checked{background:var(--bd);border-color:#9fc5b6}
html.dark .pack-item.checked{border-color:#28557d}
.pack-check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
html.dark .pack-check{background:var(--in)}
.pack-item.checked .pack-check{background:var(--grn);border-color:var(--grn);color:var(--on-acc)}
.pack-info{min-width:0;flex:1}
.pack-name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.pack-var{margin-top:4px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.var-pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--ambbg);color:var(--amb);font-weight:700;font-size:12px}
.var-none{color:var(--mut);font-size:13px}
.pack-qty{text-align:right;flex:none;padding-left:8px}
.pack-qty .qnum{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;color:var(--grn);line-height:1.1}
.pack-qty .qlbl{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase}

.pack-summary{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--sub);border:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px}
.pack-summary b{color:var(--ink)}

.modal-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.done-btn{width:100%;min-height:54px;font-size:17px;border-radius:16px}
.foot-sub-acts{display:flex;gap:8px}
.foot-sub-acts .btn{flex:1}

.empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:15px}
.stk-card{margin-top:6px}
.stk-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stk-actions .btn{width:100%}
.stk-sum{margin:12px 0;font-size:14.5px;line-height:1.5;color:var(--mut)}
.stk-item{background:var(--sub);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;max-width:100%;overflow:hidden}
.stk-item.flag{border-left:5px solid #c99a4b}
.stk-item.err{border-left:5px solid var(--bad)}
.stk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:16px;margin-bottom:6px}
.stk-top small{color:var(--mut);font-weight:400;font-size:13px}
.stk-top label{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.stk-top input[type=checkbox]{width:20px;height:20px;accent-color:var(--grn)}
.stk-item input[type=text],.stk-item textarea{width:100%;min-width:0;max-width:100%;padding:11px 13px;margin:5px 0;border:1px solid var(--line);border-radius:14px;background:var(--in);font:inherit;font-size:15px;color:var(--ink)}
.stk-item textarea{resize:none;overflow:hidden;line-height:1.45;display:block}
.stk-note{font-size:13.5px;margin:6px 0;padding:9px 11px;border-radius:12px}
.stk-note.w{background:var(--ambbg);color:var(--amb)}
.stk-note.b{background:var(--badbg);color:var(--bad);font-weight:600}
.stk-item img{width:100%;border:1px solid var(--line);border-radius:14px;margin-top:6px;background:#fff}
.stk-lnk{background:none;border:0;color:var(--grn);text-decoration:underline;font-size:14px;padding:6px 0;cursor:pointer}
.stk-msg{font-size:14px;margin-top:10px;color:var(--grn);line-height:1.45;font-weight:600}
[hidden]{display:none!important}

@media (max-width:600px){
  .ctrl-right{width:100%}
  .search{width:100%}
  .order-btn{padding:13px 14px}
  .cname{font-size:17px}
  .stk-actions{grid-template-columns:1fr}
}
.th-modal{position:fixed;inset:0;background:rgba(12,18,28,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:0}
.th-sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.28)}
.th-handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 12px}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.th-head h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--ink)}
.th-close{min-width:44px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:20px;font-weight:600;cursor:pointer}
.th-prev{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.th-prev-badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--bd);color:var(--deep);font-size:12px;font-weight:700}
.th-prev-btn{padding:8px 14px;border-radius:12px;background:var(--grn);color:var(--on-acc);font-size:13px;font-weight:700}
.th-sec{margin-bottom:14px}
.th-lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
.th-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th-preset{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.th-preset.on{border-color:var(--grn);background:var(--bd);color:var(--deep)}
.th-swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.th-sub{font-size:11.5px;font-weight:600;color:var(--mut);margin:8px 0 6px}
.th-sw{width:44px;height:44px;border-radius:14px;border:2px solid rgba(128,128,128,.28);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.th-sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.th-sw.on::after{content:"✓";font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.th-sw.light-sw.on::after{color:#0f172a;text-shadow:none}
.th-pick{width:44px;height:44px;border-radius:14px;border:1.5px dashed var(--line);background:var(--sub);padding:3px;cursor:pointer}
.th-foot{display:flex;gap:10px;margin-top:16px}
.th-foot button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--sub);color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.th-foot button.p{background:var(--grn);border-color:var(--grn);color:var(--on-acc)}
@media (min-width:640px){.th-modal{align-items:center;padding:16px}.th-sheet{border-radius:26px;padding:16px 20px 22px}.th-handle{display:none}}
.ver{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}
</style>
</head>

<script>if(window.self!==window.top)document.documentElement.classList.add("embed");try{var _p=JSON.parse(localStorage.getItem("pt_palette")||"null");if(_p&&/^(slate|obsidian|carbon|navy|forest|espresso|plum|steel)$/.test(_p.b||""))document.documentElement.classList.add("dark");else if(!_p&&localStorage.getItem("pt_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<div id="ptr" class="ptr" aria-live="polite"><span class="ptr-ic" aria-hidden="true">&#8595;</span><span class="ptr-tx">Pull down to refresh</span></div>
<header><button id="themeBtn" class="theme-btn" type="button" onclick="openThemeModal()" aria-label="Customize theme palette"><span class="theme-dots"><i id="thDot1"></i><i id="thDot2"></i><i id="thDot3"></i></span><span>Theme</span></button><img src="icon-192.png?v=17" alt="Pozzo Toys"><h1>Pozzo Dispatch</h1></header>
<main>
  <div id="app"></div>
  <section id="stickerSec" class="card stk-card" aria-label="Steadfast label converter">
    <div class="queue-head">
      <div>
        <h3>Parcel stickers (PDF &rarr; Excel)</h3>
        <span class="queue-hint">Steadfast labels &rarr; Parcel tag Excel</span>
      </div>
    </div>
    <input id="stkFile" type="file" accept="application/pdf" multiple hidden>
    <div class="stk-actions">
      <button class="btn p" type="button" onclick="document.getElementById('stkFile').click()">Choose label PDF</button>
      <button class="btn" id="stkGen" type="button" onclick="stkGenerate()" disabled>Download Excel</button>
    </div>
    <div id="stkSum" class="stk-sum">No labels loaded.</div>
    <div id="stkList"></div>
    <button class="btn" id="stkClr" type="button" onclick="stkClearAll()" hidden style="width:100%;margin-top:8px">Clear all</button>
    <div id="stkMsg" class="stk-msg"></div>
  </section>
  <p class="ver" id="dispVer">Pozzo Manager · Dispatch v9</p>
</main>
<div id="packModal" class="modal" hidden onclick="if(event.target===this)closePackWindow()"></div>
<div id="themeModal" class="th-modal" hidden onclick="if(event.target===this)closeThemeModal()"></div>
<script>
const VER="v9";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const tk=n=>"৳ "+Math.round(Number(n)||0).toLocaleString("en-US");
function today(){const t=new Date(),p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())}
function nowStamp(){const t=new Date(),p=n=>String(n).padStart(2,"0");return today()+" "+p(t.getHours())+":"+p(t.getMinutes())}
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDMY(s){
  const raw=String(s==null?"":s).trim();
  if(!raw)return "";
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso){
    const mi=Number(iso[2])-1;
    return iso[3]+"-"+(MON3[mi]||iso[2])+"-"+iso[1];
  }
  const numDmy=raw.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(numDmy){
    const mi=Number(numDmy[2])-1;
    if(mi>=0&&mi<12)return String(Number(numDmy[1])).padStart(2,"0")+"-"+MON3[mi]+"-"+numDmy[3];
  }
  const dmy=raw.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[\s-]+(\d{4})$/);
  if(dmy){
    const mi=MON3.findIndex(x=>x.toUpperCase()===dmy[2].toUpperCase());
    if(mi>-1)return String(Number(dmy[1])).padStart(2,"0")+"-"+MON3[mi]+"-"+dmy[3];
  }
  return raw;
}
function fmtDMYStamp(s){
  const raw=String(s==null?"":s).trim();
  if(!raw)return "";
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})(?:[T\s]+(\d{2}:\d{2}))?/);
  if(m)return fmtDMY(m[1])+(m[2]?" "+m[2]:"");
  return fmtDMY(raw);
}
function syncDateFace(el){
  try{
    const face=el&&el.parentNode&&el.parentNode.querySelector?el.parentNode.querySelector(".date-val"):null;
    if(face)face.textContent=fmtDMY(el.value)||"";
  }catch(e){}
}
const cfg=()=>{try{return JSON.parse(localStorage.getItem("pt_cfg")||"{}")}catch(e){return{}}};

const PACK_STORE_KEY="pt_packed_orders";
function readLocalPacked(){
  try{
    const m=JSON.parse(localStorage.getItem(PACK_STORE_KEY)||"{}");
    return m&&typeof m==="object"?m:{};
  }catch(e){return{}}
}
function saveLocalPacked(id,stamp){
  try{
    const m=readLocalPacked();
    const k=String(id||"").trim().toUpperCase();
    if(!k)return;
    if(stamp)m[k]=stamp;
    else delete m[k];
    const keys=Object.keys(m);
    if(keys.length>400){keys.slice(0,keys.length-400).forEach(old=>delete m[old])}
    localStorage.setItem(PACK_STORE_KEY,JSON.stringify(m));
  }catch(e){}
}

function splitVariant(rawName){
  let base=String(rawName||"").trim();
  const vs=[];
  const isNumOrUnit=s=>/^(?:\d+(?:[.,]\d+)?(?:\s*(?:tk\.?|taka|bdt|৳|pcs?|pc|pieces?|x))?|tk\.?|taka|bdt|৳|pcs?|pc)$/i.test(String(s||"").trim());
  const cleanV=s=>String(s||"").trim().replace(/^(?:variant|color|colour|size|model|design|type)\s*[:=\-–]\s*/i,"").trim();
  let changed=true;
  while(changed&&base){
    changed=false;
    let m=base.match(/^(.*?)\s*\(([^()]{1,60})\)\s*$/);
    if(m&&m[1].trim()&&!isNumOrUnit(m[2])){const cv=cleanV(m[2]);if(cv)vs.unshift(cv);base=m[1].trim();changed=true;continue}
    m=base.match(/^(.*?)\s*\[([^\[\]]{1,60})\]\s*$/);
    if(m&&m[1].trim()&&!isNumOrUnit(m[2])){const cv=cleanV(m[2]);if(cv)vs.unshift(cv);base=m[1].trim();changed=true}
  }
  if(!vs.length&&base){
    const dm=base.match(/^(.{2,}?)\s+(?:-|–|—|\|)\s+([^-–—|\n]{1,40})$/);
    if(dm&&!isNumOrUnit(dm[2])){const cv=cleanV(dm[2]);if(cv){vs.push(cv);base=dm[1].trim()}}
  }
  return {name:base||String(rawName||"").trim(),variant:vs.join(" · ")};
}

function normalizeOrders(rawList){
  const seen={};
  const localP=readLocalPacked();
  const out=[];
  (rawList||[]).forEach(o=>{
    if(!o||!o.id)return;
    const idUp=String(o.id).trim().toUpperCase();
    if(seen[idUp])return;
    seen[idUp]=true;
    const st=o.status||"Active";
    if(st==="Cancelled"||st==="Returned")return;
    const items=(o.items||[]).map(it=>{
      const sv=splitVariant(it.name);
      return {
        lineIndex:it.lineIndex,
        name:it.name,
        displayName:it.displayName||sv.name,
        variant:it.variant||sv.variant||"",
        qty:Math.max(0,Number(it.qty)||0),
        price:Number(it.price)||0,
        returned:Number(it.returned)||0
      };
    }).filter(it=>it.qty>0);
    if(!items.length)return;
    const packed=o.packed||localP[idUp]||"";
    if(o.packed&&!localP[idUp])saveLocalPacked(o.id,o.packed);
    out.push(Object.assign({},o,{
      id:String(o.id).trim(),
      status:st,
      packed:packed,
      items:items
    }));
  });
  return out;
}

async function api(payload){
  const c=cfg();if(!c.url||!c.key)return {ok:false,error:"nocfg"};
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
  try{
    const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:c.key},payload)),signal:ac.signal});
    return await r.json();
  }catch(e){return {ok:false,error:e&&e.name==="AbortError"?"slow":"no connection"}}
  finally{clearTimeout(t)}
}

function notifyOrderChanged(orderId){
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:"pozzo:order-dirty",orderId:orderId||""},"*")}catch(e){}
  try{if(typeof BroadcastChannel!=="undefined"){const ch=new BroadcastChannel("pozzo_sync");ch.postMessage({type:"pozzo:order-dirty",orderId:orderId||""});ch.close()}}catch(e){}
}

function goTab(tab,extra){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(Object.assign({type:"pozzo:switch-tab",tab:tab},extra||{}),"*");
      return;
    }
  }catch(e){}
  const map={dashboard:"dashboard.html",dispatch:"dispatch.html",sale:"orders.html",sales:"orders.html",stock:"stock.html",orders:"all-orders.html",sticker:"dispatch.html",stickers:"dispatch.html"};
  if(map[tab]){
    const suffix=(tab==="sale"||tab==="sales")&&extra&&extra.orderId?"#order="+encodeURIComponent(extra.orderId):"";
    window.location.href=map[tab]+suffix;
  }
}
function fmtDate(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function monthBounds(y,m){
  const start=new Date(y,m-1,1);
  const end=new Date(y,m,0);
  return {from:fmtDate(start),to:fmtDate(end)};
}
const tdNow=today();
const curMonthInit=monthBounds(Number(tdNow.slice(0,4)),Number(tdNow.slice(5,7)));

let state={
  loading:true,
  filter:"topack", // 'topack' | 'packed' | 'all'
  period:"month", // default: 'month' (This month), 'today', 'week', 'last_month', 'all', 'custom'
  customFrom:curMonthInit.from,
  customTo:tdNow,
  sortOrder:"newest", // 'newest' | 'oldest'
  q:"",
  orders:[],
  statusMsg:"",
  isErr:false,
  lastPackedId:"",
  exportPrompt:null, // {count, span, ids}
  modal:null // {order, checked:{[idx]:true}}
};

function activePeriodBounds(){
  const td=today();
  const y=Number(td.slice(0,4)),m=Number(td.slice(5,7)),day=Number(td.slice(8,10));
  if(state.period==="month")return monthBounds(y,m);
  if(state.period==="last_month"){
    const pm=m===1?12:m-1,py=m===1?y-1:y;
    return monthBounds(py,pm);
  }
  if(state.period==="today")return {from:td,to:td};
  if(state.period==="week"){
    const start=new Date(y,m-1,day-6);
    return {from:fmtDate(start),to:td};
  }
  if(state.period==="all")return {from:"2020-01-01",to:"2099-12-31"};
  const f=state.customFrom||curMonthInit.from,t=state.customTo||td;
  return f<=t?{from:f,to:t}:{from:t,to:f};
}

const DISP_CACHE_KEY="pt_disp_cache";
function getCachedDisp(){
  try{
    const raw=sessionStorage.getItem(DISP_CACHE_KEY);
    if(!raw)return null;
    const p=JSON.parse(raw);
    return(p&&p.orders&&typeof p.ts==="number")?p:null;
  }catch(e){return null}
}
function setCachedDisp(orders){
  try{sessionStorage.setItem(DISP_CACHE_KEY,JSON.stringify({ts:Date.now(),orders:orders}))}catch(e){}
}
function clearDispCache(){
  try{sessionStorage.removeItem(DISP_CACHE_KEY)}catch(e){}
}

let _dispFetchPromise=null;
async function loadDispatch(silent,fresh){
  const cached=getCachedDisp();
  if(cached&&cached.orders&&!state.orders.length){
    state.orders=normalizeOrders(cached.orders);
    state.loading=false;
    render();
    if(!fresh&&(Date.now()-cached.ts<90000))return;
  }else if(!silent&&!state.orders.length){
    state.loading=true;render();
  }

  const c=cfg();
  if(!c.url||!c.key){state.loading=false;state.orders=[];render();return}

  if(_dispFetchPromise)return _dispFetchPromise;
  _dispFetchPromise=(async()=>{
    try{
      let j=await api({action:"dispatchlist",today:today(),fresh:!!fresh});
      if(!j.ok&&j.error!=="nocfg"){
        // Fallback if script version is older
        j=await api({action:"recentorders",today:today(),limit:50});
      }
      state.loading=false;
      if(!j.ok){
        if(!silent&&!state.orders.length){state.statusMsg=j.error||"Could not load orders";state.isErr=true;render()}
        return;
      }
      state.orders=normalizeOrders(j.orders||[]);
      setCachedDisp(j.orders||[]);
      render();
      if(state.modal&&state.modal.order){
        const updated=state.orders.find(x=>x.id===state.modal.order.id);
        if(updated){state.modal.order=updated;renderPackWindow()}
      }
    }finally{
      _dispFetchPromise=null;
    }
  })();
  return _dispFetchPromise;
}

function openPackWindow(orderId){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o)return;
  state.modal={order:o,checked:{}};
  renderPackWindow();
}

function closePackWindow(){
  state.modal=null;
  const m=$("#packModal");
  if(m){m.hidden=true;m.innerHTML=""}
}

function togglePackCheck(idx){
  if(!state.modal)return;
  if(state.modal.checked[idx])delete state.modal.checked[idx];
  else state.modal.checked[idx]=true;
  renderPackWindow();
}

async function markOrderDone(orderId){
  const idx=state.orders.findIndex(x=>x.id===orderId);
  if(idx<0)return;
  const o=state.orders[idx];
  const stamp=nowStamp();
  o.packed=stamp;
  saveLocalPacked(o.id,stamp);
  clearDispCache();
  state.lastPackedId=o.id;
  state.statusMsg="Packed "+(o.name||"customer")+" ("+o.id+") — removed from To pack list.";
  state.isErr=false;
  closePackWindow();
  render();

  const j=await api({action:"packorder",id:o.id,today:today()});
  if(j&&j.ok){
    o.packed=j.packed||stamp;
    saveLocalPacked(o.id,o.packed);
    notifyOrderChanged(o.id);
  }else if(j&&j.error&&j.error!=="nocfg"&&j.error!=="no connection"&&j.error!=="slow"){
    o.packed="";
    saveLocalPacked(o.id,"");
    clearDispCache();
    state.lastPackedId="";
    state.statusMsg="Could not save packed status: "+j.error;
    state.isErr=true;
    render();
  }
}

async function unpackOrder(orderId){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o)return;
  o.packed="";
  saveLocalPacked(o.id,"");
  clearDispCache();
  state.lastPackedId="";
  state.statusMsg="Moved "+(o.name||"customer")+" ("+o.id+") back to To pack list.";
  state.isErr=false;
  closePackWindow();
  render();

  const j=await api({action:"packorder",id:o.id,undo:true,today:today()});
  if(j&&j.ok)notifyOrderChanged(o.id);
}

          <span class="pack-check" aria-hidden="true">${isCk?"&#10003;":""}</span>

function fileDate(){return fmtDMY(today())}
async function exportPending(){
  state.statusMsg="Preparing parcel entry file…";state.isErr=false;state.lastPackedId="";state.exportPrompt=null;render();
  const j=await api({action:"list",mode:"next",today:today()});
  if(!j.ok){state.statusMsg=j.error||"Could not get pending orders";state.isErr=true;render();return}
  if(!j.orders.length){state.statusMsg="No unexported active orders right now.";state.isErr=false;render();return}
  if(typeof ExcelJS==="undefined"){state.statusMsg="Excel library did not load. Check internet connection.";state.isErr=true;render();return}
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Sheet1");
  const cols=[["Invoice",16],["Name",24],["Address",50],["Phone",15],["Amount",12],["Note",50],["Contact Name",16],["Contact Phone",15]];
  ws.columns=cols.map(([h,w])=>({header:h,width:w}));
  ws.getRow(1).font={bold:true};
  ws.getColumn(4).numFmt="@";ws.getColumn(8).numFmt="@";
  j.orders.forEach(o=>{
    const r=ws.addRow([o.id,o.name,o.address,String(o.phone),Number(o.amount),o.note,null,o.phone2?String(o.phone2):null]);
    r.getCell(4).numFmt="@";r.getCell(8).numFmt="@";
  });
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download="Pozzo Toys Parcel Entry "+fileDate()+".xlsx";
  document.body.appendChild(a);a.click();a.remove();
  const n=j.orders.length,span=j.orders[0].id+" to "+j.orders[n-1].id;
  state.statusMsg="";
  state.exportPrompt={count:n,span:span,ids:j.orders.map(o=>o.id)};
  render();
}

async function confirmParcelExported(){
  if(!state.exportPrompt)return;
  const {count,span,ids}=state.exportPrompt;
  state.exportPrompt=null;
  const mk=await api({action:"mark",ids:ids,today:today()});
  state.statusMsg=mk.ok?"Exported and marked "+count+" order(s): "+span+".":"File downloaded, but could not mark exported: "+(mk.error||"");
  state.isErr=!mk.ok;
  if(mk.ok)notifyOrderChanged("");
  loadDispatch(false);
}

function dismissParcelExport(){
  if(!state.exportPrompt)return;
  const {count,span}=state.exportPrompt;
  state.exportPrompt=null;
  state.statusMsg="Parcel file downloaded for "+count+" order(s) ("+span+"). Left unmarked for next export.";
  state.isErr=false;
  render();
}

function parseOrderDate(rawDate, rawId){
  if(rawDate){
    const s=String(rawDate).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
    const p=n=>String(n).padStart(2,"0");
    const numDmy=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if(numDmy)return numDmy[3]+"-"+p(Number(numDmy[2]))+"-"+p(Number(numDmy[1]));
    const m=s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[\s-]+(\d{4})$/);
    if(m){
      const mi=MON3.findIndex(x=>x.toUpperCase()===m[2].toUpperCase());
      if(mi>-1)return m[3]+"-"+p(mi+1)+"-"+p(Number(m[1]));
    }
  }
  if(rawId){
    const m=String(rawId).toUpperCase().match(/^PZ(\d{2})([A-Z]{3})/);
    if(m){
      const mi=MON3.findIndex(x=>x.toUpperCase()===m[2]);
      if(mi>-1){
        const yr="20"+m[1];
        const p=n=>String(n).padStart(2,"0");
        return yr+"-"+p(mi+1)+"-15";
      }
    }
  }
  return "";
}

function filteredOrders(){
  const ql=state.q.trim().toLowerCase();
  const bounds=activePeriodBounds();
  const applyPeriod=(state.filter==="packed"||state.filter==="all");
  let list=state.orders.filter(o=>{
    if(state.filter==="topack"&&o.packed)return false;
    if(state.filter==="packed"&&!o.packed)return false;
    if(applyPeriod&&state.period!=="all"){
      const od=parseOrderDate(o.date,o.id);
      if(od&&(od<bounds.from||od>bounds.to))return false;
    }
    if(!ql)return true;
    const itemText=(o.items||[]).map(it=>it.name+" "+it.displayName+" "+it.variant).join(" ");
    return (o.id+" "+o.name+" "+o.phone+" "+o.address+" "+fmtDMY(o.date)+" "+itemText).toLowerCase().includes(ql);
  });
  if(state.sortOrder==="oldest")list=list.slice().reverse();
  return list;
}

(function initPTR(onRefresh){
  if(typeof document==="undefined")return;
  let el=typeof document.getElementById==="function"?document.getElementById("ptr"):null;
  const tx=()=>el&&el.querySelector?el.querySelector(".ptr-tx"):null;
  const ic=()=>el&&el.querySelector?el.querySelector(".ptr-ic"):null;
  let sx=0,sy=0,lock="",pull=0,busy=false;
  const THRESH=52;
  function setVisual(h,cls,text,glyph){
    if(!el)return;
    el.className="ptr"+(cls?" "+cls:"");
    if(el.style)el.style.height=h+"px";
    const t=tx();if(t&&text)t.textContent=text;
    const g=ic();if(g&&glyph)g.innerHTML=glyph;
  }
  async function triggerPullRefresh(){
    if(busy)return;
    busy=true;
    setVisual(44,"active busy","Refreshing…","&#8635;");
    const t0=Date.now();
    try{await onRefresh()}catch(e){}
    finally{
      const wait=Math.max(0,260-(Date.now()-t0));
      const tm=setTimeout(()=>{busy=false;setVisual(0,"","Pull down to refresh","&#8595;")},wait);
      if(tm&&typeof tm.unref==="function")tm.unref();
    }
  }
  window.triggerPullRefresh=triggerPullRefresh;
  const scrollTop=()=>Math.max(window.scrollY||0,(document.documentElement&&document.documentElement.scrollTop)||0,(document.body&&document.body.scrollTop)||0);
  document.addEventListener("touchstart",e=>{
    if(busy||!e.touches||e.touches.length!==1)return;
    if(scrollTop()>2){lock="up";return}
    const tgt=e.target;
    if(tgt&&tgt.closest&&(tgt.closest(".sheet")||tgt.closest(".modal:not([hidden])")||tgt.closest("input, textarea, select"))){lock="modal";return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock="";pull=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(busy||lock==="up"||lock==="h"||lock==="modal"||!e.touches||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!lock){
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){lock="h";return}
      if(dy<-6){lock="up";return}
      if(dy>8&&Math.abs(dy)>Math.abs(dx)){if(scrollTop()>2){lock="up";return}lock="v"}else return;
    }
    if(lock==="v"){
      if(dy<=0){pull=0;setVisual(0,"pulling","","");return}
      pull=Math.min(76,Math.round(dy*0.55));
      if(e.cancelable)e.preventDefault();
      setVisual(pull,"pulling active"+(pull>=THRESH?" ready":""),pull>=THRESH?"Release to refresh":"Pull down to refresh","&#8595;");
    }
  },{passive:false});
  function onEnd(){
    if(busy)return;
    const goRef=(lock==="v"&&pull>=THRESH);
    lock="";pull=0;
    if(goRef)triggerPullRefresh();
    else setVisual(0,"","Pull down to refresh","&#8595;");
  }
  document.addEventListener("touchend",onEnd,{passive:true});
  document.addEventListener("touchcancel",onEnd,{passive:true});
})(()=>{if(STK_P.length){stkMark();stkRender();}return loadDispatch(false);});

/* ---------- Steadfast Label PDF -> Parcel Tag Excel (integrated under Dispatch) ---------- */
try{if(typeof pdfjsLib!=="undefined"&&pdfjsLib.GlobalWorkerOptions)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
const STK_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
let STK_P=[];
let STK_PAGES=0;
const STK_BN=/[\u0980-\u09FF]/;
const stkGrow=t=>{if(t&&t.style){t.style.height="auto";t.style.height=(t.scrollHeight||44)+4+"px"}};

const $id=id=>typeof document==="undefined"?null:(typeof document.getElementById==="function"?document.getElementById(id):typeof document.querySelector==="function"?document.querySelector("#"+id):null);

(function bindStkFile(){
  const inp=$id("stkFile");
  if(!inp)return;
  inp.onchange=async e=>{
    const files=(e&&e.target&&e.target.files)||[];
    for(const file of files)await stkReadPdf(file);
    inp.value="";
    stkRender();
  };
})();

async function stkReadPdf(file){
  if(typeof pdfjsLib==="undefined"){
    const m=$id("stkMsg");
    if(m){m.style.color="var(--bad)";m.textContent="PDF reader failed to load. Check internet connection."}
    return;
  }
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  for(let n=1;n<=doc.numPages;n++){
    STK_PAGES++;
    const pg=await doc.getPage(n);
    const tc=await pg.getTextContent();
    const rows=[];
    tc.items.filter(i=>i.str.trim()).forEach(i=>{
      const y=i.transform[5],x=i.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<4);
      if(!r){r={y,items:[]};rows.push(r)}
      r.items.push({x,s:i.str,h:i.height||12,w:i.width||0});
    });
    rows.sort((a,b)=>b.y-a.y);
    const joinItems=its=>{
      its.sort((a,b)=>a.x-b.x);
      let out="",prev=null;
      its.forEach(it=>{
        if(prev){
          const gap=it.x-(prev.x+prev.w);
          const need=!/\s$/.test(out)&&!/^\s/.test(it.s)&&(prev.w===0||gap>0.1*Math.max(prev.h,it.h));
          out+=(need?" ":"")+it.s;
        }else out=it.s;
        prev=it;
      });
      return out.replace(/\s+/g," ").trim();
    };
    const lines=rows.map(r=>joinItems(r.items));
    const p=stkParse(lines,file.name,n);
    if(STK_BN.test(p.name+p.addr)){
      const mEl=$id("stkMsg");
      if(mEl){mEl.style.color="var(--ink)";mEl.textContent="Reading Bangla from page "+n+" (first run downloads language data)...";}
      await stkOcrFix(p,pg,rows);
      if(mEl)mEl.textContent="";
    }
    await stkMakeCrop(p,pg,rows);
    STK_P.push(p);
  }
  stkMark();
}

async function stkMakeCrop(p,pg,rows){
  try{
    const has=(r,re)=>r.items.some(i=>re.test(i.s.trim()));
    const ri=rows.findIndex(r=>has(r,/^NAME$/)),ci=rows.findIndex(r=>has(r,/^CASH/));
    const ii=rows.findIndex(r=>has(r,/^INVOICE$/)),wi=rows.findIndex(r=>has(r,/^WEIGHT$/));
    if(ri<0||ci<0)throw new Error("layout");
    const vp=pg.getViewport({scale:3});
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    const H=r=>Math.max(...r.items.map(i=>i.h));
    const bi=rows.findIndex(r=>/^(\d\s*){8,}$/.test(r.items.map(i=>i.s).join(" ").trim()));
    const cut=(a,z,up,dn,x0)=>{
      const l=Math.max(0,vp.convertToViewportPoint((x0===undefined?rows[a].items[0].x:x0)-14,0)[0]);
      const t=Math.max(0,vp.convertToViewportPoint(0,rows[a].y+H(rows[a])*up)[1]);
      const b=Math.min(c.height,vp.convertToViewportPoint(0,rows[z].y-H(rows[z])*dn)[1]);
      const w=c.width-l-4,h=b-t;
      if(h<30)throw new Error("size");
      const o=document.createElement("canvas");o.width=w;o.height=h;
      const g=o.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(c,l,t,w,h,0,0,w,h);
      return o;
    };
    const parts=[];
    if(bi>=0&&bi<ri-1){
      const mx=Math.min(...rows.slice(bi,ri).map(r=>r.items[0].x));
      try{parts.push(cut(bi,ri-1,.85,.4,mx))}catch(e){}
    }else if(ii>=0&&wi>ii){try{parts.push(cut(ii,wi,1.1,.4))}catch(e){}}
    else if(bi>=0){try{parts.push(cut(bi,bi,1.1,.5))}catch(e){}}
    parts.push(cut(ri,ci,1.1,.9));
    const W2=Math.max(...parts.map(o=>o.width)),gap=8;
    const out=document.createElement("canvas");out.width=W2;out.height=parts.reduce((s,o)=>s+o.height+gap,-gap);
    const g=out.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,out.width,out.height);
    let y=0;parts.forEach(o=>{g.drawImage(o,0,y);y+=o.height+gap});
    p.crop=out.toDataURL("image/jpeg",.88);
  }catch(e){p.crop=await stkSnap(pg)}
}

function stkBoost(src){
  const k=1.6,o=document.createElement("canvas");o.width=Math.round(src.width*k);o.height=Math.round(src.height*k);
  const g=o.getContext("2d");g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";
  g.fillStyle="#fff";g.fillRect(0,0,o.width,o.height);g.drawImage(src,0,0,o.width,o.height);
  const im=g.getImageData(0,0,o.width,o.height),d=im.data;
  for(let i=0;i<d.length;i+=4){const v=(d[i]+d[i+1]+d[i+2])/3,t=Math.max(0,Math.min(255,(v-70)/(185-70)*255));d[i]=d[i+1]=d[i+2]=t}
  g.putImageData(im,0,0);return o;
}
let STK_W,STK_WN,STK_WB;
async function stkOcrFix(p,pg,rows){
  try{
    const has=(r,re)=>r.items.some(i=>re.test(i.s.trim()));
    const ri=rows.findIndex(r=>has(r,/^NAME$/)),ai=rows.findIndex(r=>has(r,/^ADDRESS$/));
    const ei=rows.findIndex((r,k)=>k>ai&&has(r,/^(NOTE|AREA|ITEM|CASH)/));
    if(ri<0||ai<0)throw new Error("layout");
    const vp=pg.getViewport({scale:3});
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    const H=r=>Math.max(...r.items.map(i=>i.h));
    const X=r=>(r.items[1]?r.items[1].x:r.items[0].x+60)-4;
    const strip=(a,b,up=.9,dn=.35)=>{
      const x1=X(rows[a]),y1=rows[a].y+H(rows[a])*up,y2=rows[b].y-H(rows[b])*dn;
      const l=vp.convertToViewportPoint(x1,0)[0],t=vp.convertToViewportPoint(0,y1)[1],bt=vp.convertToViewportPoint(0,y2)[1];
      const w=c.width-l-8,h=bt-t,o=document.createElement("canvas");
      o.width=w;o.height=h;const g=o.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);
      g.drawImage(c,l,t,w,h,0,0,w,h);
      const q=document.createElement("canvas"),m=30;q.width=w+2*m;q.height=h+2*m;
      const k=q.getContext("2d");k.fillStyle="#fff";k.fillRect(0,0,q.width,q.height);k.drawImage(o,m,m);return q;
    };
    const last=ei<0?ai:ei-1;
    if(!STK_W)STK_W=await Tesseract.createWorker("ben+eng");
    const rd=async(o,w)=>((await w.recognize(o)).data.text||"").replace(/\s+/g," ").trim();
    if(STK_BN.test(p.addr)){
      const pure=!/[A-Za-z0-9]/.test(p.addr);
      let w=STK_W;
      if(pure){if(!STK_WB)STK_WB=await Tesseract.createWorker("ben");w=STK_WB}
      const sA=strip(ai,last);
      let ad=await rd(sA,w);
      const bad=t=>t.split(/\s+/).filter(x=>/\u09CD$/.test(x.replace(/[,.:;\u0964]+$/,""))).length;
      if(bad(ad)>0){const ad2=await rd(stkBoost(sA),w);if(STK_BN.test(ad2)&&bad(ad2)<bad(ad))ad=ad2}
      p.dbg={tl:p.addr,ocr:ad};
      if(STK_BN.test(ad)){p.addr=ad;const sus=ad.match(/[A-Za-z]{3,}/g);if(pure&&sus)p.suspect=sus}else p.addrFail=true;
    }
    if(STK_BN.test(p.name)){
      const o=strip(ri,ri,1.4,.7);
      let nm=await rd(o,STK_W);
      if(!STK_BN.test(nm)){
        if(!STK_WN){STK_WN=await Tesseract.createWorker("ben+eng");await STK_WN.setParameters({tessedit_pageseg_mode:"7"})}
        nm=await rd(o,STK_WN);
      }
      if(STK_BN.test(nm))p.name=nm;else{p.name="";p.nameFail=true}
    }
    p.ocr=true;
  }catch(e){p.ocrFail=true}
}

function stkParse(lines,file,n){
  const t=lines.join("\n");
  const g=re=>{const m=t.match(re);return m?m[1].trim():""};
  const p={file,page:n,flags:[],inc:true};
  p.sf=g(/SF-ID\s*(\d{6,})/);
  if(!p.sf){const bl=lines.find(l=>/^(\d\s*){8,}$/.test(l));if(bl)p.sf=bl.replace(/\s/g,"")}
  p.name=(lines.find(l=>/^NAME\b/.test(l))||"").replace(/^NAME\s*/,"");
  p.phone=g(/PHONE\s*(\+?[\d\s-]{10,})/).replace(/[\s-]/g,"").replace(/^\+?88/,"");
  const a=lines.findIndex(l=>/^ADDRESS\b/.test(l));
  const e=lines.findIndex((l,i)=>i>a&&/^(NOTE|AREA|ITEM|CASH ON DELIVERY)\b/.test(l));
  p.addr=a<0?"":lines.slice(a,e<0?a+3:e).join(" ").replace(/^ADDRESS\s*/,"").replace(/\bDh\.(?!\w)/g,"Dhaka").trim();
  const c=t.match(/CASH ON DELIVERY\s*\D*?([\d,]+)/);
  p.cod=c?parseInt(c[1].replace(/,/g,""),10):null;
  const d=t.match(/Printed:\s*(\d{2})\/(\d{2})\/(\d{2})/);
  p.date=d?{d:+d[1],m:+d[2],y:d[3]}:null;
  if(!p.sf||!p.name||!p.phone||p.cod===null||!p.addr){p.err=true;p.flags.push(["b","Could not read all fields. Fill in or exclude."]);p.inc=false}
  if(!p.date)p.flags.push(["w","No print date found."]);
  return p;
}

async function stkSnap(pg){
  const v=pg.getViewport({scale:1});
  const s=Math.min(1,560/v.width)*1.2;
  const vp=pg.getViewport({scale:s});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  return c.toDataURL("image/jpeg",.7);
}

function stkMark(){
  STK_P.forEach(p=>{p.flags=p.flags.filter(f=>!f[2]);});
  STK_P.forEach((p,i)=>{
    const add=(k,s)=>p.flags.push([k,s,1]);
    if(p.nameFail)add("b","Name could not be read. Type it from the picture.");
    if(p.suspect)add("b","Check these words, they look misread: "+p.suspect.join(", "));
    if(p.addrFail)add("b","Address could not be read. The text below may be wrong. Fix it from the picture.");
    if(STK_BN.test(p.name+p.addr))add("w",p.ocr?"Bangla was read from the label picture by OCR. Check it against the picture.":"Bangla could not be read automatically. The PDF text is wrong. Type it from the picture.");
    if(/[…]|\.\.\.$/.test(p.name+p.addr))add("w","Label text is cut off (…). Complete it from the original order.");
    if(p.cod===0)add("w","COD is ৳0. Fully prepaid, or a return or exchange?");
    const same=STK_P.filter((q,j)=>j!==i&&q.sf&&q.sf===p.sf);
    if(same.length)add("b","Duplicate SF-ID in this session.");
    const likely=STK_P.filter((q,j)=>j!==i&&q.sf!==p.sf&&q.name&&q.name===p.name&&q.phone===p.phone&&q.cod===p.cod);
    if(likely.length)add("b","Same name, phone and COD as "+likely.map(q=>q.sf).join(", ")+". Likely duplicate booking.");
    if(p.dupDecided===undefined)p.dupDecided=false;
    if((same.length||likely.length)&&!p.dupDecided){p.inc=false;p.dupDecided=true}
  });
}

function stkRender(){
  const L=$id("stkList");
  if(!L)return;
  L.innerHTML="";
  STK_P.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="stk-item"+(p.err?" err":p.flags.length?" flag":"");
    const fl=p.flags.map(f=>`<div class="stk-note ${f[0]}">${esc(f[1])}</div>`).join("");
    d.innerHTML=`<div class="stk-top"><span>${esc(p.sf||"No SF-ID")} <small>(page ${p.page})</small></span>
      <label><input type="checkbox" ${p.inc?"checked":""} onchange="STK_P[${i}].inc=this.checked;stkStat()"> Include</label></div>
      ${fl}
      <input type="text" value="${esc(p.sf)}" oninput="STK_P[${i}].sf=this.value.replace(/\\D/g,'')" inputmode="numeric" placeholder="SF-ID">
      <input type="text" value="${esc(p.name)}" oninput="STK_P[${i}].name=this.value" placeholder="Customer name">
      <input type="text" value="${esc(p.phone)}" oninput="STK_P[${i}].phone=this.value" inputmode="tel" placeholder="Phone">
      <textarea rows="2" oninput="STK_P[${i}].addr=this.value;stkGrow(this)" placeholder="Address">${esc(p.addr)}</textarea>
      <input type="text" value="${p.cod===null?"":p.cod}" oninput="STK_P[${i}].cod=this.value===''?null:+this.value.replace(/[^\\d]/g,'')" inputmode="numeric" placeholder="COD amount">
      ${p.crop?`<img src="${p.crop}" alt="Label">`:""}
      ${p.img?`<button class="stk-lnk" type="button" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Show label</button><img src="${p.img}" hidden>`:""}`;
    if(L.appendChild)L.appendChild(d);
  });
  if(typeof document!=="undefined"&&typeof document.querySelectorAll==="function"){
    document.querySelectorAll("#stkList textarea").forEach(stkGrow);
  }
  const clr=$id("stkClr");
  if(clr)clr.hidden=!STK_P.length;
  stkStat();
}

function stkStat(){
  const inc=STK_P.filter(p=>p.inc).length;
  const flagged=STK_P.filter(p=>p.flags.length).length;
  const sEl=$id("stkSum");
  const gEl=$id("stkGen");
  if(sEl)sEl.innerHTML=STK_P.length?`<b>${STK_PAGES}</b> label pages read, <b>${STK_P.length}</b> parcels found, <b>${inc}</b> included.${flagged?` <span style="color:var(--amb)">${flagged} need a look.</span>`:""}`:"No labels loaded.";
  if(gEl)gEl.disabled=!inc;
}

function stkClearAll(){
  STK_P=[];STK_PAGES=0;
  const m=$id("stkMsg");
  if(m)m.textContent="";
  stkRender();
}

async function stkGenerate(){
  const m=$id("stkMsg");
  if(m)m.textContent="";
  const inc=STK_P.filter(p=>p.inc);
  const bad=inc.filter(p=>!p.sf||!p.name||!p.phone||p.cod===null||!p.addr);
  if(bad.length){if(m){m.style.color="var(--bad)";m.textContent="Some included parcels have empty fields.";}return}
  if(typeof ExcelJS==="undefined"){if(m){m.style.color="var(--bad)";m.textContent="Excel library did not load. Check internet connection.";}return}
  const groups={};
  inc.forEach(p=>{const k=p.date?`${String(p.date.d).padStart(2,"0")}-${MON3[p.date.m-1]||String(p.date.m).padStart(2,"0")}-${String(p.date.y).length===2?"20"+p.date.y:p.date.y}`:"Unknown date";(groups[k]=groups[k]||[]).push(p)});
  const done=[],files=[];
  for(const [k,rows] of Object.entries(groups)){
    let serial=1;
    try{serial=(+localStorage.getItem("pt_"+k)||0)+1}catch(e){}
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Sheet1");
    const W=[23,15,17,16,50];
    ws.columns=["Parcel ID","COD Amount","Customer Name","Phone Number","Delivery Address"].map((h,i)=>({header:h,width:W[i]}));
    rows.forEach(p=>ws.addRow([`Parcel ID:${p.sf}`,`COD: ৳${p.cod.toLocaleString("en-US")}`,p.name,p.phone,p.addr]));
    ws.eachRow((r,n)=>{
      const ad=n===1?"":String(r.getCell(5).value||"");
      const per=STK_BN.test(ad)?36:52,lines=Math.max(1,Math.ceil(ad.length/per));
      r.height=n===1?26:22+(lines-1)*18;
      r.eachCell(c=>{
        c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
        c.numFmt="@";
        if(n===1){c.font={name:"Segoe UI",bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF001B36"}}}
        else c.font={name:"Segoe UI"};
      });
    });
    const name=`Parcel tag ${k} PZ ${String(serial).padStart(2,"0")}.xlsx`;
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    files.push({name,blob,k,serial});
    done.push(`${name} (${rows.length} parcels)`);
  }
  const keep=()=>files.forEach(f=>{try{localStorage.setItem("pt_"+f.k,f.serial)}catch(e){}});
  files.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()});
  keep();
  if(m){m.style.color="var(--grn)";m.textContent="Saved: "+done.join("; ")+". To share it, open it from your Downloads or Files app.";}
}

const clampC=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function parseHex(h){const m=String(h||"").trim().match(/^#?([0-9a-f]{6})$/i);if(!m)return[31,111,168];const n=parseInt(m[1],16);return[(n>>16)&255,(n>>8)&255,n&255]}
function toHex(rgb){return"#"+rgb.map(x=>clampC(Math.round(x),0,255).toString(16).padStart(2,"0")).join("")}
function mixHex(a,b,t){const c1=parseHex(a),c2=parseHex(b);return toHex([c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t])}
function lumHex(h){const c=parseHex(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function normPal(raw){
  const d={b:"paper",p:"#1f6fa8",s:"#1f6fa8"};
  if(!raw||typeof raw!=="object")return d;
  return{
    b:PT_BASES[raw.b]?raw.b:d.b,
    p:/^#[0-9a-f]{6}$/i.test(raw.p||"")?raw.p.toLowerCase():d.p,
    s:/^#[0-9a-f]{6}$/i.test(raw.s||"")?raw.s.toLowerCase():(/^#[0-9a-f]{6}$/i.test(raw.p||"")?raw.p.toLowerCase():d.s)
  };
}
function readSavedPalette(){
  try{
    const raw=localStorage.getItem("pt_palette");
    if(raw)return normPal(JSON.parse(raw));
    if(localStorage.getItem("pt_theme")==="dark")return{b:"slate",p:"#4da3e3",s:"#1f6fa8"};
  }catch(e){}
  return normPal(null);
}
function computeThemeVars(pal){
  const base=PT_BASES[pal.b]||PT_BASES.paper,dark=!!base.dark,rawP=pal.p,rawS=pal.s;
  const acc=dark?(lumHex(rawP)<0.24?mixHex(rawP,"#ffffff",0.36):rawP):(lumHex(rawP)>0.38?mixHex(rawP,"#0e1726",0.30):rawP);
  const deep=dark?(lumHex(rawS)<0.45?mixHex(rawS,"#ffffff",0.60):mixHex(rawS,"#ffffff",0.25)):(lumHex(rawS)>0.22?mixHex(rawS,"#09131d",0.48):mixHex(rawS,"#09131d",0.22));
  const sub=dark?mixHex(base.card,rawS,0.12):mixHex(base.card,rawS,0.065);
  const bd=dark?mixHex(base.bg,rawS,0.26):mixHex(base.card,rawS,0.14);
  const ptrR=dark?mixHex(base.bg,rawS,0.36):mixHex(base.card,rawS,0.24);
  const onAcc=lumHex(acc)>(dark?0.42:0.44)?"#0b1926":"#ffffff";
  return{dark,base,acc,vars:{"--bg":base.bg,"--card":base.card,"--hdr":base.hdr,"--sub":sub,"--in":base.inp,"--line":base.line,"--ink":base.ink,"--mut":base.mut,"--grn":acc,"--blue":acc,"--deep":deep,"--bd":bd,"--ptr-r":ptrR,"--on-acc":onAcc,"--bad":dark?"#f28b75":"#a8431f","--badbg":dark?"#3b1d19":"#f6e4dc","--amb":dark?"#f0b865":"#8a5a14","--ambbg":dark?"#362916":"#f6ece0"}};
}
let curPalette=readSavedPalette();
function applyPaletteTheme(pal,save){
  try{
    curPalette=normPal(pal);
    const t=computeThemeVars(curPalette);
    const root=document&&document.documentElement;
    if(root&&root.classList)root.classList.toggle("dark",t.dark);
    if(root&&root.style&&typeof root.style.setProperty==="function")Object.keys(t.vars).forEach(k=>root.style.setProperty(k,t.vars[k]));
    const d1=document.getElementById("thDot1"),d2=document.getElementById("thDot2"),d3=document.getElementById("thDot3");
    if(d1)d1.style.background=t.base.bg;if(d2)d2.style.background=t.acc;if(d3)d3.style.background=curPalette.s;
    if(save){
      try{localStorage.setItem("pt_palette",JSON.stringify(curPalette))}catch(e){}
      try{localStorage.setItem("pt_theme",t.dark?"dark":"light")}catch(e){}
    }
  }catch(e){}
}
